<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן">
<meta name="theme-color" content="#1B2028">
<title>יומן</title>
<style>
  :root {
    --bg: #12151c;
    --surface: #1b2028;
    --surface2: #242b36;
    --ink: #f2f2f0;
    --muted: #9aa1ad;
    --gold: #d1a24a;
    --steel: #6fa0c9;
    --green: #6fb08a;
    --danger: #d9694f;
    --purple: #a48add;
  }
  * { box-sizing: border-box; }
  input, select, textarea { font-size: 16px; }
  body { margin:0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; touch-action: manipulation; }
  .app { max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .cal-header .nav-btn { background:none; border:none; color: var(--ink); font-size:20px; padding:6px 10px; cursor:pointer; }
  .cal-header .month-label { font-size:19px; font-weight:800; }
  .today-btn { display:block; margin: 0 auto 14px; background: var(--surface); border:1px solid var(--surface2); color: var(--gold); font-size:13px; font-weight:700; padding:7px 16px; border-radius:999px; cursor:pointer; }
  .top-actions { display:flex; gap:10px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .top-actions .today-btn { margin: 0; }
  .today-btn.connected { color: var(--green); border-color: var(--green); }
  .modal-secondary { width:100%; margin-top:10px; padding:12px; border:1px solid var(--surface2); border-radius:12px; background:none; color: var(--ink); font-size:14px; font-weight:700; cursor:pointer; }
  .toast { position:fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background: var(--surface2); color: var(--ink); padding:10px 18px; border-radius:16px; font-size:13px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,.4); z-index:30; opacity:0; pointer-events:none; transition: opacity .25s ease; max-width: 88vw; text-align:center; }
  .toast.show { opacity:1; }
  .weekday-row { display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:11px; color: var(--muted); font-weight:700; margin-bottom:6px; }
  .day-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
  .day-cell { aspect-ratio: 1 / 1; border-radius:10px; background: var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:6px; cursor:pointer; position:relative; }
  .day-cell.out-month { opacity:.35; }
  .day-cell.selected { background: var(--surface2); box-shadow: inset 0 0 0 2px var(--gold); }
  .day-num { font-size:13px; font-weight:600; }
  .day-cell.is-today .day-num { background: var(--gold); color:#1b1406; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .day-dots { display:flex; gap:2px; margin-top:4px; flex-wrap:wrap; justify-content:center; max-width:32px; }
  .day-dot { width:5px; height:5px; border-radius:50%; }
  .day-more { font-size:9px; color: var(--muted); margin-top:2px; }
  .agenda-head { display:flex; align-items:center; justify-content:space-between; margin: 18px 0 8px; }
  .day-view-overlay .agenda-head { margin: 2px 16px 8px; }
  .agenda-head h2 { font-size:15px; margin:0; }
  .event-item { display:flex; align-items:center; gap:10px; background: var(--surface); border:1px solid var(--surface2); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .event-color-bar { width:4px; align-self:stretch; border-radius:4px; flex-shrink:0; }
  .event-time { font-size:12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width:52px; }
  .event-title { font-size:14px; font-weight:700; flex:1; }
  .event-location { font-size:11px; color: var(--muted); margin-top:2px; }
  .empty-note { text-align:center; color: var(--muted); font-size:13px; margin: 30px 0; }
  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); background: var(--gold); color:#1b1406; border:none; border-radius:999px; padding:14px 28px; font-size:15px; font-weight:800; box-shadow:0 8px 20px rgba(0,0,0,.4); cursor:pointer; }
  .fab-secondary { left:auto; right: calc(16px + env(safe-area-inset-right)); transform:none; width:50px; height:50px; padding:0; font-size:22px; background: var(--surface2); color: var(--ink); border:1px solid var(--surface); }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; align-items:flex-end; justify-content:center; }
  .overlay.show, .overlay.closing { display:flex; }
  .overlay.show { animation: overlayFadeIn .18s ease; }
  .overlay.closing { animation: overlayFadeOut .18s ease forwards; }
  .overlay.show .modal, .overlay.show .confirm-box { animation: modalSlideUp .22s ease; }
  .overlay.closing .modal, .overlay.closing .confirm-box { animation: modalSlideDown .18s ease forwards; }
  @keyframes overlayFadeIn { from { background:rgba(0,0,0,0); } to { background:rgba(0,0,0,.6); } }
  @keyframes overlayFadeOut { from { background:rgba(0,0,0,.6); } to { background:rgba(0,0,0,0); } }
  @keyframes modalSlideUp { from { transform: translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes modalSlideDown { from { transform:none; opacity:1; } to { transform: translateY(40px); opacity:0; } }
  .modal { background: var(--surface); width:100%; max-width:720px; border-radius:18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-head h2 { margin:0; font-size:18px; }
  .icon-btn { background:none; border:none; cursor:pointer; }
  .modal label { display:block; font-size:12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input[type=text], .modal input[type=date], .modal input[type=time], .modal textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--surface2); background: var(--surface2); color: var(--ink); font-size:16px; font-family:inherit; }
  .modal textarea { min-height:80px; resize:vertical; line-height:1.5; }
  .time-row { display:flex; gap:10px; }
  .time-row > div { flex:1; }
  .allday-row { display:flex; align-items:center; gap:8px; margin-top:12px; margin-bottom:14px; font-size:14px; }
  .allday-row input { width:auto; }
  .datetime-row { display:flex; align-items:stretch; background: var(--surface2); border:1px solid var(--surface2); border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .modal .datetime-row input[type=date], .modal .datetime-row input[type=time] {
    flex:1; width:auto; min-width:0; border:none; background:transparent; border-radius:0; margin:0; padding:11px 8px; text-align:center;
  }
  .dt-divider { width:1px; align-self:stretch; margin:8px 0; background: rgba(156,163,175,0.25); }
  .datetime-row.no-time .dt-divider, .datetime-row.no-time .dt-time { display:none; }
  .color-row { display:flex; gap:10px; margin-top:6px; }
  .color-swatch { width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .location-row { display:flex; gap:8px; align-items:center; }
  .location-row input { flex:1; margin-bottom:0 !important; }
  .map-btn { flex-shrink:0; width:44px; height:44px; border-radius:10px; border:1px solid var(--surface2); background: var(--surface2); font-size:18px; cursor:pointer; }
  .color-swatch.selected { border-color: var(--ink); }
  .modal-submit { width:100%; margin-top:18px; padding:13px; border:none; border-radius:12px; background: var(--gold); color:#1b1406; font-size:15px; font-weight:800; cursor:pointer; }
  .modal-delete { width:100%; margin-top:10px; padding:12px; border:1px solid var(--danger); border-radius:12px; background:none; color: var(--danger); font-size:14px; font-weight:700; cursor:pointer; }
  .form-error { color: var(--danger); font-size:12px; margin: 6px 0; text-align:center; font-weight:600; }
  .confirm-box { background: var(--surface); border-radius:16px; padding:20px; max-width:320px; margin:auto; text-align:center; }
  .confirm-box p { margin:0 0 16px; font-size:14px; }
  .confirm-actions { display:flex; gap:10px; }
  .confirm-actions button { flex:1; padding:11px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer; }
  .confirm-cancel { background: var(--surface2); color: var(--ink); }
  .confirm-delete { background: var(--danger); color:#fff; }
  .day-view-overlay { display:none; position:fixed; inset:0; background: var(--bg); z-index:40; flex-direction:column; }
  .day-view-overlay.show, .day-view-overlay.closing { display:flex; }
  .day-view-overlay.show { animation: dayViewIn .22s ease; }
  .day-view-overlay.closing { animation: dayViewOut .18s ease forwards; }
  @keyframes dayViewIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes dayViewOut { from { opacity:1; transform:none; } to { opacity:0; transform: translateY(16px); } }
  .day-view-header { display:flex; align-items:center; justify-content:space-between; padding: calc(16px + env(safe-area-inset-top)) 16px 6px; }
  .day-view-header .icon-btn { background:none; border:none; cursor:pointer; padding:4px 10px; }
  .day-view-month-label { font-size:16px; font-weight:800; }
  .week-strip { display:flex; padding: 0 10px 12px; gap:4px; }
  .week-strip .wd-cell { flex:1; text-align:center; padding:8px 2px; border-radius:12px; cursor:pointer; }
  .week-strip .wd-cell .wd-letter { font-size:11px; color: var(--muted); margin-bottom:4px; }
  .week-strip .wd-cell .wd-num { font-size:15px; font-weight:700; width:30px; height:30px; line-height:30px; margin:0 auto; border-radius:50%; }
  .week-strip .wd-cell.selected .wd-num { background: var(--gold); color:#1b1406; }
  .week-strip .wd-cell.is-today:not(.selected) .wd-num { box-shadow: inset 0 0 0 1.5px var(--gold); }
  .day-view-content { flex:1; overflow-y:auto; padding: 0 0 calc(20px + env(safe-area-inset-bottom)); touch-action: pan-y; }
  .allday-chips-row { display:flex; flex-wrap:wrap; gap:6px; margin: 0 16px 8px; }
  .allday-chip { font-size:12px; font-weight:700; padding:5px 10px; border-radius:8px; color:#fff; }
  .timeline-wrap { position:relative; height: 1440px; margin: 0 16px; transition: opacity .12s ease; }
  .anim-next { animation: slideInLeft .22s ease; }
  .anim-prev { animation: slideInRight .22s ease; }
  @keyframes slideInLeft { from { transform: translateX(24px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes slideInRight { from { transform: translateX(-24px); opacity:0; } to { transform:none; opacity:1; } }
  .timeline-grid { position:absolute; inset:0; }
  .hour-line { position:absolute; left:0; right:56px; height:0; border-top:1px solid var(--surface2); }
  .hour-label { position:absolute; right:2px; font-size:11px; color: var(--muted); background: var(--bg); padding: 0 2px; z-index:1; }
  .half-line { position:absolute; left:0; right:56px; height:0; border-top:1px solid rgba(156,163,175,0.15); }
  .timeline-events { position:absolute; top:0; left:0; right:58px; bottom:0; }
  .timeline-event { position:absolute; border-radius:8px; padding:4px 8px; overflow:hidden; cursor:pointer; box-sizing:border-box; }
  .timeline-event .te-title { font-size:12px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .timeline-event .te-time { font-size:10px; color:rgba(255,255,255,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now-line { position:absolute; left:0; right:56px; height:0; border-top:2px solid var(--danger); z-index:2; }
  .now-line .now-dot { position:absolute; right:-5px; top:-5px; width:10px; height:10px; border-radius:50%; background: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <div class="cal-header">
    <button class="nav-btn" id="prevMonth" aria-label="חודש קודם"><span dir="ltr" style="unicode-bidi: isolate-override;">›</span></button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-btn" id="nextMonth" aria-label="חודש הבא"><span dir="ltr" style="unicode-bidi: isolate-override;">‹</span></button>
  </div>
  <div class="top-actions">
    <button class="today-btn" id="todayBtn">היום</button>
    <button class="today-btn" id="googleBtn">🔗 חיבור ל-Google Calendar</button>
  </div>
  <div class="weekday-row" id="weekdayRow"></div>
  <div class="day-grid" id="dayGrid"></div>

  <div class="agenda-head">
    <h2 id="monthAgendaLabel"></h2>
  </div>
  <div id="monthAgendaList"></div>
  <p class="empty-note" id="monthEmptyNote" style="display:none;">אין אירועים ביום זה.</p>
</div>

<div class="day-view-overlay" id="dayViewOverlay">
  <div class="day-view-header">
    <button class="icon-btn" id="dayViewBack" style="color: var(--ink); font-size: 22px; display:flex; align-items:center; gap:4px;">
      <span dir="ltr" style="unicode-bidi: isolate-override;">‹</span>
      <span style="font-size:14px; font-weight:600;">חודש</span>
    </button>
    <div class="day-view-month-label" id="dayViewMonthLabel"></div>
    <button class="icon-btn" id="dayViewAdd" style="color: var(--gold); font-size: 24px; font-weight: 800;">+</button>
  </div>
  <div class="week-strip" id="weekStrip"></div>
  <div class="agenda-head">
    <h2 id="agendaLabel"></h2>
  </div>
  <div class="allday-chips-row" id="allDayRow" style="display:none;"></div>
  <div class="day-view-content" id="dayViewContent">
    <div class="timeline-wrap" id="timelineWrap">
      <div class="timeline-grid" id="timelineGrid"></div>
      <div class="timeline-events" id="timelineEvents"></div>
      <div class="now-line" id="nowLine" style="display:none;"><span class="now-dot"></span></div>
    </div>
  </div>
</div>

<button class="fab" id="addBtn">+ אירוע חדש</button>
<button class="fab fab-secondary" id="scanImageBtn" title="הוספה מתמונה">📷</button>
<input type="file" id="scanImageInput" accept="image/*" style="display:none;">

<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="formTitleHead">אירוע חדש</h2>
      <button class="icon-btn" id="closeForm" style="color:var(--muted); font-size:18px;">×</button>
    </div>
    <label>כותרת</label>
    <input type="text" id="formTitle" placeholder="שם האירוע">
    <div class="allday-row">
      <input type="checkbox" id="formAllDay">
      <label for="formAllDay" style="margin:0;">כל היום</label>
    </div>
    <label>מתחיל</label>
    <div class="datetime-row" id="startDateTimeRow">
      <input type="date" id="formDate" class="dt-date">
      <div class="dt-divider" id="startDivider"></div>
      <input type="time" id="formStart" class="dt-time">
    </div>
    <label>מסתיים</label>
    <div class="datetime-row" id="endDateTimeRow">
      <input type="date" id="formEndDate" class="dt-date">
      <div class="dt-divider" id="endDivider"></div>
      <input type="time" id="formEnd" class="dt-time">
    </div>
    <label>צבע</label>
    <div class="color-row" id="colorRow"></div>
    <label>מיקום</label>
    <div class="location-row">
      <input type="text" id="formLocation" placeholder="למשל: רחוב הרצל 12, תל אביב">
      <button type="button" class="map-btn" id="openMapBtn" title="פתיחה במפות">📍</button>
    </div>
    <label>הערות</label>
    <textarea id="formNotes" placeholder="פרטים נוספים (לא חובה)"></textarea>
    <p class="form-error" id="formError" style="display:none;"></p>
    <button class="modal-submit" id="formSubmit">שמירה</button>
    <button class="modal-secondary" id="formEmail" style="display:none;">✉️ שליחת פרטי האירוע במייל</button>
    <button class="modal-delete" id="formDelete" style="display:none;">מחיקת אירוע</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="deleteOverlay">
  <div class="confirm-box">
    <p>למחוק את האירוע הזה?</p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="cancelDelete">ביטול</button>
      <button class="confirm-delete" id="confirmDelete">מחיקה</button>
    </div>
  </div>
</div>

<script>
// ===== Google Calendar sync config =====
const GOOGLE_CLIENT_ID = "239143987006-42gvbinfhcgdcr6bpfp50n9orjbrclnb.apps.googleusercontent.com";
const GOOGLE_SCOPES = "https://www.googleapis.com/auth/calendar.events";
const GOOGLE_API_BASE = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
const REFRESH_TOKEN_KEY = "google_refresh_token_v1";
const REDIRECT_URI = window.location.origin + window.location.pathname;

let googleAccessToken = null;
let googleConnected = false;
let syncInFlight = false;

const STORAGE_KEY = "calendar_events_v1";
let events = [];
try { events = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { events = []; }

const HEBREW_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const WEEKDAY_LETTERS = ["א","ב","ג","ד","ה","ו","ש"];
const COLORS = [
  { key:"gold", value:"#d1a24a" },
  { key:"steel", value:"#6fa0c9" },
  { key:"green", value:"#6fb08a" },
  { key:"danger", value:"#d9694f" },
  { key:"purple", value:"#a48add" }
];

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth() + 1;
let selectedDate = toISO(now);
let editingId = null;
let deleteTargetId = null;
let selectedColor = "gold";

function toISO(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function showOverlay(id) {
  const el = document.getElementById(id);
  el.classList.remove("closing");
  el.classList.add("show");
}
function hideOverlay(id, duration) {
  const el = document.getElementById(id);
  el.classList.add("closing");
  setTimeout(() => { el.classList.remove("show", "closing"); }, duration || 190);
}
function pad2(n) { return String(n).padStart(2,"0"); }
function addDaysISO(dateStr, n) {
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function colorValue(key) { const c = COLORS.find(c => c.key === key); return c ? c.value : COLORS[0].value; }

document.getElementById("weekdayRow").innerHTML = WEEKDAY_LETTERS.map(l => `<div>${l}</div>`).join("");
document.getElementById("colorRow").innerHTML = COLORS.map(c =>
  `<div class="color-swatch" data-color="${c.key}" style="background:${c.value};"></div>`
).join("");

function renderCalendar() {
  document.getElementById("monthLabel").textContent = HEBREW_MONTHS[viewMonth-1] + " " + viewYear;

  const firstOfMonth = new Date(viewYear, viewMonth-1, 1);
  const startWeekday = firstOfMonth.getDay();
  const count = daysInMonth(viewYear, viewMonth);
  const totalCells = Math.ceil((startWeekday + count) / 7) * 7;
  const gridStart = new Date(viewYear, viewMonth-1, 1 - startWeekday);

  const todayISO = toISO(new Date());
  let html = "";
  for (let i = 0; i < totalCells; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const iso = toISO(cellDate);
    const inMonth = cellDate.getMonth() === viewMonth - 1;
    const dayEvents = events.filter(e => eventOccursOn(e, iso)).sort(sortEvents);
    const dots = dayEvents.slice(0,4).map(e => `<span class="day-dot" style="background:${colorValue(e.color)};"></span>`).join("");
    const more = dayEvents.length > 4 ? `<div class="day-more">+${dayEvents.length-4}</div>` : "";
    html += `<div class="day-cell ${inMonth?"":"out-month"} ${iso===selectedDate?"selected":""} ${iso===todayISO?"is-today":""}" data-date="${iso}">
      <div class="day-num">${cellDate.getDate()}</div>
      <div class="day-dots">${dots}</div>
      ${more}
    </div>`;
  }
  const grid = document.getElementById("dayGrid");
  grid.innerHTML = html;
  grid.querySelectorAll(".day-cell").forEach(cell => {
    cell.addEventListener("click", () => {
      const iso = cell.dataset.date;
      const [y,m] = iso.split("-").map(Number);
      if (m !== viewMonth || y !== viewYear) { viewYear = y; viewMonth = m; }
      openDayView(iso);
    });
  });
  renderMonthAgenda();
}

function sortEvents(a, b) {
  if (a.allDay && !b.allDay) return -1;
  if (!a.allDay && b.allDay) return 1;
  return (a.startTime||"").localeCompare(b.startTime||"");
}
function eventEndDate(e) { return e.endDate || e.date; }
function eventOccursOn(e, iso) { return iso >= e.date && iso <= eventEndDate(e); }
function getDaySegment(e, iso) {
  const endDate = eventEndDate(e);
  const isFirst = iso === e.date;
  const isLast = iso === endDate;
  const startMin = isFirst ? timeToMinutes(e.startTime) : 0;
  let endMin = isLast ? (e.endTime ? timeToMinutes(e.endTime) : startMin + 30) : 1440;
  if (endMin <= startMin) endMin = startMin + 30;
  return { start: startMin, end: endMin, isFirst, isLast };
}
function segmentLabel(e, iso) {
  const seg = getDaySegment(e, iso);
  if (seg.isFirst && seg.isLast) return (e.startTime||"") + (e.endTime ? " - " + e.endTime : "");
  if (seg.isFirst) return (e.startTime||"") + " ←";
  if (seg.isLast) return "← " + (e.endTime||"");
  return "אירוע מתמשך";
}

function formatAgendaLabel(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  return d + " ב" + HEBREW_MONTHS[m-1] + " " + y;
}

function renderMonthAgenda() {

  const list = events.filter(e => eventOccursOn(e, selectedDate)).sort(sortEvents);

  `).join("");
  wrap.querySelectorAll(".event-item").forEach(item => {

}

let lastSelectedDate = null;
const HOUR_H = 60;

function renderAgenda() {
  document.getElementById("agendaLabel").textContent = formatAgendaLabel(selectedDate);
  const list = events.filter(e => eventOccursOn(e, selectedDate)).sort(sortEvents);
  const allDayEvents = list.filter(e => e.allDay);
  const timedEvents = list.filter(e => !e.allDay);

  const allDayRow = document.getElementById("allDayRow");
  if (allDayEvents.length) {
    allDayRow.style.display = "flex";
    allDayRow.innerHTML = allDayEvents.map(e =>
      `<div class="allday-chip" data-id="${e.id}" style="background:${colorValue(e.color)};">${escapeHtml(e.title)}</div>`
    ).join("");
    allDayRow.querySelectorAll(".allday-chip").forEach(chip => {
      chip.addEventListener("click", () => openEdit(chip.dataset.id));
    });
  } else {
    allDayRow.style.display = "none";
    allDayRow.innerHTML = "";
  }

  renderTimelineGrid();
  renderTimelineEvents(timedEvents);
  renderNowLine();

  if (document.getElementById("dayViewOverlay").classList.contains("show")) {
    document.getElementById("dayViewMonthLabel").textContent = formatAgendaLabel(selectedDate);
    renderWeekStrip();
    animateDayChange();
    scrollTimelineToRelevantTime();
  }
  lastSelectedDate = selectedDate;
}

function animateDayChange() {
  const wrap = document.getElementById("timelineWrap");
  if (!lastSelectedDate || lastSelectedDate === selectedDate) return;
  const cls = selectedDate > lastSelectedDate ? "anim-next" : "anim-prev";
  wrap.classList.remove("anim-next", "anim-prev");
  void wrap.offsetWidth; // force reflow so the animation restarts
  wrap.classList.add(cls);
}

function timeToMinutes(t) {
  if (!t) return 0;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + (m || 0);
}

function renderTimelineGrid() {
  const grid = document.getElementById("timelineGrid");
  let html = "";
  for (let h = 0; h < 24; h++) {
    html += `<div class="hour-line" style="top:${h*HOUR_H}px;"></div>`;
    html += `<span class="hour-label" style="top:${h*HOUR_H - 8}px;">${h}:00</span>`;
    html += `<div class="half-line" style="top:${h*HOUR_H + HOUR_H/2}px;"></div>`;
  }
  grid.innerHTML = html;
}

function renderTimelineEvents(timedEvents) {
  const wrap = document.getElementById("timelineEvents");
  const withTimes = timedEvents.map(e => {
    const seg = getDaySegment(e, selectedDate);
    return { e, start: seg.start, end: seg.end };
  }).sort((a,b) => a.start - b.start || a.end - b.end);

  // simple column assignment for overlapping events
  const columnsEnd = [];
  withTimes.forEach(item => {
    let col = columnsEnd.findIndex(endTime => endTime <= item.start);
    if (col === -1) { col = columnsEnd.length; columnsEnd.push(item.end); }
    else { columnsEnd[col] = item.end; }
    item.col = col;
  });
  // determine max overlapping columns per event's own overlapping cluster
  withTimes.forEach(item => {
    const overlapping = withTimes.filter(o => o.start < item.end && o.end > item.start);
    item.totalCols = Math.max(...overlapping.map(o => o.col)) + 1;
  });

  wrap.innerHTML = withTimes.map(item => {
    const { e, start, end, col, totalCols } = item;
    const top = (start / 60) * HOUR_H;
    const height = Math.max(((end - start) / 60) * HOUR_H, 22);
    const widthPct = 100 / totalCols;
    const leftPct = col * widthPct;
    return `<div class="timeline-event" data-id="${e.id}" style="top:${top}px; height:${height}px; right:calc(${leftPct}% + 2px); width:calc(${widthPct}% - 4px); background:${colorValue(e.color)};">
      <div class="te-title">${escapeHtml(e.title)}</div>
      <div class="te-time">${segmentLabel(e, selectedDate)}</div>
      ${e.location && height > 40 ? `<div class="te-time">📍 ${escapeHtml(e.location)}</div>` : ""}
    </div>`;
  }).join("");
  wrap.querySelectorAll(".timeline-event").forEach(el => {
    el.addEventListener("click", () => openEdit(el.dataset.id));
  });
}

function renderNowLine() {
  const line = document.getElementById("nowLine");
  const now = new Date();
  if (toISO(now) !== selectedDate) { line.style.display = "none"; return; }
  const minutes = now.getHours() * 60 + now.getMinutes();
  line.style.top = (minutes / 60 * HOUR_H) + "px";
  line.style.display = "block";
}

function scrollTimelineToRelevantTime() {
  const content = document.getElementById("dayViewContent");
  const now = new Date();
  const isToday = toISO(now) === selectedDate;
  const targetMinutes = isToday ? (now.getHours() * 60) : 7 * 60;
  const targetPx = Math.max((targetMinutes / 60) * HOUR_H - 100, 0);
  content.scrollTo({ top: targetPx, behavior: lastSelectedDate ? "smooth" : "auto" });
}

function isoAddDays(iso, n) {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
}
function startOfWeekIso(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() - dt.getDay());
  return toISO(dt);
}

function renderWeekStrip() {
  const weekStartIso = startOfWeekIso(selectedDate);
  const todayIso = toISO(new Date());
  let html = "";
  for (let i = 0; i < 7; i++) {
    const iso = isoAddDays(weekStartIso, i);
    const [,, d] = iso.split("-");
    html += `<div class="wd-cell ${iso===selectedDate?"selected":""} ${iso===todayIso?"is-today":""}" data-date="${iso}">
      <div class="wd-letter">${WEEKDAY_LETTERS[i]}</div>
      <div class="wd-num">${parseInt(d,10)}</div>
    </div>`;
  }
  const strip = document.getElementById("weekStrip");
  strip.innerHTML = html;
  strip.querySelectorAll(".wd-cell").forEach(cell => {
    cell.addEventListener("click", () => {
      selectedDate = cell.dataset.date;
      const [y,m] = selectedDate.split("-").map(Number);
      viewYear = y; viewMonth = m;
      renderAgenda();
    });
  });
}

// swipe left/right on the day view to move between days
(function() {
  let touchStartX = null, touchStartY = null;
  const content = document.getElementById("dayViewContent");
  content.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  content.addEventListener("touchend", (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      // RTL layout: swipe right (dx > 0) = go to previous day, swipe left = next day
      selectedDate = isoAddDays(selectedDate, dx > 0 ? -1 : 1);
      const [y,m] = selectedDate.split("-").map(Number);
      viewYear = y; viewMonth = m;
      renderAgenda();
    }
  }, { passive: true });
})();

function nearestRoundHourTimes() {
  const now = new Date();
  let startHour = now.getHours();
  if (now.getMinutes() > 0 || now.getSeconds() > 0) startHour += 1;
  if (startHour > 23) startHour = 23;
  let endHour = startHour + 1;
  if (endHour > 23) endHour = 23;
  return { start: pad2(startHour) + ":00", end: pad2(endHour) + ":00" };
}

function resizeImageForOCR(file, maxDim, quality) {
  maxDim = maxDim || 2000;
  quality = quality || 0.9;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let width = img.naturalWidth, height = img.naturalHeight;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        if (!blob) { reject(new Error("כשל בעיבוד התמונה")); return; }
        resolve(blob);
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("כשל בטעינת התמונה")); };
    img.src = url;
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("כשל בהמרת התמונה"));
    reader.readAsDataURL(blob);
  });
}

function startGoogleConnect() {
  const authUrl = "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "code",

  });

async function exchangeCodeForTokens(code) {
  const res = await fetch("/api/google-auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, redirect_uri: REDIRECT_URI })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "auth failed");
  if (data.refresh_token) localStorage.setItem(REFRESH_TOKEN_KEY, data.refresh_token);
  googleAccessToken = data.access_token;
  googleConnected = true;
}

async function refreshGoogleSession() {
  const rt = localStorage.getItem(REFRESH_TOKEN_KEY);
  if (!rt) return false;
  try {
    const res = await fetch("/api/google-refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: rt })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "refresh failed");
    googleAccessToken = data.access_token;
    googleConnected = true;
    return true;
  } catch(err) {
    localStorage.removeItem(REFRESH_TOKEN_KEY);
    googleConnected = false;
    googleAccessToken = null;
    return false;
  }
}

async function initGoogleAuth() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (code) {
    window.history.replaceState({}, document.title, window.location.pathname);
    try {
      await exchangeCodeForTokens(code);
      showToast("מחובר ל-Google Calendar");
      updateGoogleButton();
      syncFromGoogle();
    } catch(err) {
      showToast("החיבור ל-Google נכשל: " + err.message);
    }
    return;
  }
  const restored = await refreshGoogleSession();
  if (restored) {
    updateGoogleButton();
    syncFromGoogle();
  }
}
initGoogleAuth();

document.getElementById("googleBtn").addEventListener("click", () => {
  if (googleConnected) {
    const rt = localStorage.getItem(REFRESH_TOKEN_KEY);
    if (rt) fetch(`https://oauth2.googleapis.com/revoke?token=${encodeURIComponent(rt)}`, { method: "POST" }).catch(() => {});
    localStorage.removeItem(REFRESH_TOKEN_KEY);
    googleAccessToken = null;
    googleConnected = false;
    updateGoogleButton();
    showToast("נותקת מ-Google Calendar");
    return;
  }
  startGoogleConnect();
});

async function googleApiFetch(url, options={}, retried=false) {
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers||{}), "Authorization": "Bearer " + googleAccessToken, "Content-Type": "application/json" }
  });
  if (res.status === 401 && !retried) {
    const ok = await refreshGoogleSession();
    if (ok) return googleApiFetch(url, options, true);
    googleConnected = false; googleAccessToken = null; updateGoogleButton();
    showToast("החיבור ל-Google פג — יש להתחבר מחדש");
    throw new Error("unauthorized");
  }
  if (!res.ok) {
    let detail = "";
    try {
      const errBody = await res.json();
      detail = (errBody && errBody.error && (errBody.error.message || errBody.error)) || "";
      if (typeof detail !== "string") detail = JSON.stringify(detail);
    } catch(e) {}
    throw new Error("Google API error " + res.status + (detail ? ": " + detail : ""));
  }
  return res.status === 204 ? null : res.json();
}

function eventToGooglePayload(e) {
  const base = { summary: e.title || "", description: e.notes || "", location: e.location || "" };
  const endDate = eventEndDate(e);
  if (e.allDay) {
    return { ...base, start: { date: e.date }, end: { date: addDaysISO(endDate, 1) } };
  }
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Jerusalem";
  return {
    ...base,
    start: { dateTime: `${e.date}T${e.startTime || "00:00"}:00`, timeZone },
    end: { dateTime: `${endDate}T${e.endTime || e.startTime || "00:00"}:00`, timeZone }
  };
}

function googleEventToLocal(gEv) {
  const isAllDay = !!(gEv.start && gEv.start.date);
  let date, endDate, startTime = "", endTime = "";
  if (isAllDay) {
    date = gEv.start.date;
    endDate = gEv.end && gEv.end.date ? isoAddDays(gEv.end.date, -1) : date;
    if (endDate < date) endDate = date;
  } else {
    const startDt = new Date(gEv.start.dateTime);
    date = toISO(startDt);
    startTime = pad2(startDt.getHours()) + ":" + pad2(startDt.getMinutes());
    endDate = date;
    if (gEv.end && gEv.end.dateTime) {
      const endDt = new Date(gEv.end.dateTime);
      endDate = toISO(endDt);
      endTime = pad2(endDt.getHours()) + ":" + pad2(endDt.getMinutes());
    }
  }
  return { googleEventId: gEv.id, title: gEv.summary || "(ללא כותרת)", date, endDate, allDay: isAllDay, startTime, endTime, notes: gEv.description || "", location: gEv.location || "", color: "steel" };
}

async function pushCreateToGoogle(e) {
  if (!googleConnected) return;
  try {
    const created = await googleApiFetch(GOOGLE_API_BASE, { method: "POST", body: JSON.stringify(eventToGooglePayload(e)) });
    e.googleEventId = created.id;
    persist();
  } catch(err) {
    console.error("Google create error:", err);
    showToast("שגיאה ביצירת האירוע ב-Google: " + (err.message || "לא ידוע"));
  }
}
async function pushUpdateToGoogle(e) {
  if (!googleConnected) return;
  if (!e.googleEventId) { pushCreateToGoogle(e); return; }
  try {
    await googleApiFetch(`${GOOGLE_API_BASE}/${e.googleEventId}`, { method: "PATCH", body: JSON.stringify(eventToGooglePayload(e)) });
  } catch(err) {
    console.error("Google update error:", err);
    showToast("שגיאה בעדכון האירוע ב-Google: " + (err.message || "לא ידוע"));
  }
}
async function pushDeleteToGoogle(e) {
  if (!googleConnected || !e.googleEventId) return;
  try {
    await googleApiFetch(`${GOOGLE_API_BASE}/${e.googleEventId}`, { method: "DELETE" });
  } catch(err) { /* likely already gone on Google's side */ }
}

async function syncFromGoogle() {
  if (!googleConnected || syncInFlight) return;
  syncInFlight = true;
  try {
    const rangeStart = new Date(viewYear, viewMonth-2, 1);
    const rangeEnd = new Date(viewYear, viewMonth+1, 0);
    const params = new URLSearchParams({
      timeMin: rangeStart.toISOString(), timeMax: rangeEnd.toISOString(),
      singleEvents: "true", orderBy: "startTime", maxResults: "250"
    });
    const data = await googleApiFetch(`${GOOGLE_API_BASE}?${params.toString()}`);
    const items = (data && data.items) || [];
    const fetchedIds = new Set(items.filter(gEv => gEv.status !== "cancelled").map(gEv => gEv.id));
    let changed = 0;
    items.forEach(gEv => {
      if (gEv.status === "cancelled") return;
      const local = googleEventToLocal(gEv);
      const idx = events.findIndex(e => e.googleEventId === gEv.id);
      if (idx >= 0) {
        events[idx] = { ...events[idx], ...local };
      } else {
        events.push({ ...local, id: uid(), createdAt: Date.now() });
      }
      changed++;
    });
    // Reconcile deletions: if a previously-synced event no longer appears in
    // Google's response for this range, it was deleted (here or on another
    // device) — drop the stale local copy. Unsynced local-only events
    // (no googleEventId yet) are always kept.
    const rangeStartISO = toISO(rangeStart), rangeEndISO = toISO(rangeEnd);
    const before = events.length;
    events = events.filter(e => {
      if (!e.googleEventId) return true;
      if (fetchedIds.has(e.googleEventId)) return true;
      const overlapsRange = e.date <= rangeEndISO && eventEndDate(e) >= rangeStartISO;
      return !overlapsRange;
    });
    if (events.length !== before) changed++;
    if (changed) { persist(); renderCalendar(); renderAgenda(); }
  } catch(err) { /* errors already surfaced via googleApiFetch */ }
  finally { syncInFlight = false; }
}

// Pull fresh events automatically: whenever the app regains focus (e.g. switching
// back from another app, or coming back to the browser tab), and periodically
// while it stays open — so changes made on another device show up without
// needing to manually navigate months.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") syncFromGoogle();
});
window.addEventListener("focus", () => syncFromGoogle());
setInterval(() => { if (document.visibilityState === "visible") syncFromGoogle(); }, 45000);


// ---- .ics export ----
// ---- Send by email ----
document.getElementById("formEmail").addEventListener("click", () => {
  const e = events.find(x => x.id === editingId);
  if (!e) return;
  const subject = encodeURIComponent(e.title || "אירוע ביומן");
  const lines = [];
  const endDate = eventEndDate(e);
  if (endDate !== e.date) {
    lines.push("תאריך: " + formatAgendaLabel(e.date) + " עד " + formatAgendaLabel(endDate));
  } else {
    lines.push("תאריך: " + formatAgendaLabel(e.date));
  }
  lines.push("שעה: " + (e.allDay ? "כל היום" : (e.startTime || "") + (e.endTime ? " - " + e.endTime : "")));
  if (e.location) lines.push("מיקום: " + e.location);
  if (e.notes) { lines.push(""); lines.push(e.notes); }
  const body = encodeURIComponent(lines.join("\n"));
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
});
</script>
