<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן">
<meta name="theme-color" content="#1B2028">
<title>יומן</title>
<style>
  :root {
    --bg: #12151c;
    --surface: #1b2028;
    --surface2: #242b36;
    --ink: #f2f2f0;
    --muted: #9aa1ad;
    --gold: #d1a24a;
    --steel: #6fa0c9;
    --green: #6fb08a;
    --danger: #d9694f;
    --purple: #a48add;
  }
  * { box-sizing: border-box; }
  input, select, textarea { font-size: 16px; }
  body { margin:0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; touch-action: manipulation; }
  .app { max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); position:relative; }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .cal-header .nav-btn { background:none; border:none; color: var(--ink); font-size:20px; padding:6px 10px; cursor:pointer; }
  .cal-header .month-label { font-size:19px; font-weight:800; }
  .today-btn { display:block; margin: 0 auto 14px; background: var(--surface); border:1px solid var(--surface2); color: var(--gold); font-size:13px; font-weight:700; padding:7px 16px; border-radius:999px; cursor:pointer; }
  .top-actions { display:flex; gap:10px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .top-actions .today-btn { margin: 0; }
  .today-btn.connected { color: var(--green); border-color: var(--green); }
  .modal-secondary { width:100%; margin-top:10px; padding:12px; border:1px solid var(--surface2); border-radius:12px; background:none; color: var(--ink); font-size:14px; font-weight:700; cursor:pointer; }
  .toast { position:fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background: var(--surface2); color: var(--ink); padding:10px 18px; border-radius:16px; font-size:13px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,.4); z-index:30; opacity:0; pointer-events:none; transition: opacity .25s ease; max-width: 88vw; text-align:center; }
  .toast.show { opacity:1; }
  .weekday-row { display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:11px; color: var(--muted); font-weight:700; margin-bottom:6px; }
  .day-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
  .day-cell { aspect-ratio: 1 / 1; border-radius:10px; background: var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:6px; cursor:pointer; position:relative; }
  .day-cell.out-month { opacity:.35; }
  .day-cell.selected { background: var(--surface2); box-shadow: inset 0 0 0 2px var(--gold); }
  .day-num { font-size:13px; font-weight:600; }
  .day-cell.is-today .day-num { background: var(--gold); color:#1b1406; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .day-dots { display:flex; gap:2px; margin-top:4px; flex-wrap:wrap; justify-content:center; max-width:32px; }
  .day-dot { width:5px; height:5px; border-radius:50%; }
  .day-more { font-size:9px; color: var(--muted); margin-top:2px; }
  .agenda-head { display:flex; align-items:center; justify-content:space-between; margin: 18px 0 8px; }
  .day-view-overlay .agenda-head { margin: 2px 16px 8px; }
  .agenda-head h2 { font-size:15px; margin:0; }
  .event-item { display:flex; align-items:center; gap:10px; background: var(--surface); border:1px solid var(--surface2); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .event-color-bar { width:4px; align-self:stretch; border-radius:4px; flex-shrink:0; }
  .event-time { font-size:12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width:52px; }
  .event-title { font-size:14px; font-weight:700; flex:1; }
  .event-location { font-size:11px; color: var(--muted); margin-top:2px; }
  .empty-note { text-align:center; color: var(--muted); font-size:13px; margin: 30px 0; }
  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); background: var(--gold); color:#1b1406; border:none; border-radius:999px; padding:14px 28px; font-size:15px; font-weight:800; box-shadow:0 8px 20px rgba(0,0,0,.4); cursor:pointer; }
  .fab-secondary { left:auto; right: calc(16px + env(safe-area-inset-right)); transform:none; width:50px; height:50px; padding:0; font-size:22px; background: var(--surface2); color: var(--ink); border:1px solid var(--surface); }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; align-items:flex-end; justify-content:center; }
  .overlay.show, .overlay.closing { display:flex; }
  .overlay.show { animation: overlayFadeIn .18s ease; }
  .overlay.closing { animation: overlayFadeOut .18s ease forwards; }
  .overlay.show .modal, .overlay.show .confirm-box { animation: modalSlideUp .22s ease; }
  .overlay.closing .modal, .overlay.closing .confirm-box { animation: modalSlideDown .18s ease forwards; }
  @keyframes overlayFadeIn { from { background:rgba(0,0,0,0); } to { background:rgba(0,0,0,.6); } }
  @keyframes overlayFadeOut { from { background:rgba(0,0,0,.6); } to { background:rgba(0,0,0,0); } }
  @keyframes modalSlideUp { from { transform: translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes modalSlideDown { from { transform:none; opacity:1; } to { transform: translateY(40px); opacity:0; } }
  .modal { background: var(--surface); width:100%; max-width:720px; border-radius:18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; overscroll-behavior: contain; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; touch-action:none; }
  .modal-drag-handle { width:40px; height:5px; background: var(--surface2); border-radius:3px; margin:0 auto 14px; touch-action:none; }
  .modal-head h2 { margin:0; font-size:18px; }
  .icon-btn { background:none; border:none; cursor:pointer; }
  .modal label { display:block; font-size:12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input[type=text], .modal input[type=email], .modal input[type=date], .modal input[type=time], .modal textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--surface2); background: var(--surface2); color: var(--ink); font-size:16px; font-family:inherit; }
  .modal textarea { min-height:80px; resize:vertical; line-height:1.5; }
  .time-row { display:flex; gap:10px; }
  .time-row > div { flex:1; }
  .allday-row { display:flex; align-items:center; gap:8px; margin-top:12px; margin-bottom:14px; font-size:14px; }
  .allday-row input { width:auto; }
  .datetime-row { display:flex; align-items:stretch; background: var(--surface2); border:1px solid var(--surface2); border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .modal .datetime-row input[type=date], .modal .datetime-row input[type=time] {
    flex:1; width:auto; min-width:0; border:none; background:transparent; border-radius:0; margin:0; padding:11px 8px; text-align:center;
  }
  .dt-divider { width:1px; align-self:stretch; margin:8px 0; background: rgba(156,163,175,0.25); }
  .datetime-row.no-time .dt-divider, .datetime-row.no-time .dt-time { display:none; }
  .color-row { display:flex; gap:10px; margin-top:6px; }
  .color-swatch { width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .location-row { display:flex; gap:8px; align-items:center; position:relative; }
  .location-row input { flex:1; margin-bottom:0 !important; }
  .loc-suggestions { position:relative; margin-top:-8px; margin-bottom:12px; background: var(--surface2); border-radius:10px; overflow:hidden; max-height:180px; overflow-y:auto; box-shadow:0 6px 16px rgba(0,0,0,.35); }
  .loc-suggestion-item { padding:10px 12px; font-size:13px; border-bottom:1px solid rgba(255,255,255,.06); cursor:pointer; }
  .loc-suggestion-item:last-child { border-bottom:none; }
  .loc-suggestion-item:active { background: rgba(255,255,255,.08); }
  .title-suggestion-item { padding:9px 12px; }
  .tsi-title { font-weight:700; font-size:14px; color: var(--ink); }
  .tsi-sub { font-size:12px; color: var(--muted); margin-top:3px; }
  .loc-suggestion-item.loc-current { color: var(--gold); font-weight:700; }
  .map-btn { flex-shrink:0; width:44px; height:44px; border-radius:10px; border:1px solid var(--surface2); background: var(--surface2); font-size:18px; cursor:pointer; }
  .color-swatch.selected { border-color: var(--ink); }
  .modal-submit { width:100%; margin-top:18px; padding:13px; border:none; border-radius:12px; background: var(--gold); color:#1b1406; font-size:15px; font-weight:800; cursor:pointer; }
  .modal-delete { width:100%; margin-top:10px; padding:12px; border:1px solid var(--danger); border-radius:12px; background:none; color: var(--danger); font-size:14px; font-weight:700; cursor:pointer; }
  .welcome-profile-item { display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; margin-top:8px; background: var(--surface2); border:none; border-radius:12px; color: var(--ink); font-size:14px; cursor:pointer; text-align:right; }
  .welcome-profile-avatar { width:30px; height:30px; border-radius:50%; background: var(--gold); color:#1b1406; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; }
  .welcome-profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .user-avatar-img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .user-avatar-initial { font-size:14px; font-weight:800; color: var(--ink); }
  .account-avatar { width:84px; height:84px; border-radius:50%; margin:0 auto; background: var(--gold); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .account-avatar img { width:100%; height:100%; object-fit:cover; }
  .account-avatar span { font-size:30px; font-weight:800; color:#1b1406; }
  .view-row { padding:12px 0; border-bottom:1px solid var(--surface2); font-size:15px; display:flex; align-items:center; gap:8px; }
  .view-row:first-of-type { padding-top:0; }
  .view-color-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .view-title-row { display:flex; align-items:center; gap:9px; }
  .view-title-row h2 { margin:0; font-size:21px; line-height:1.3; }
  .view-subtitle { margin-top:5px; margin-right:20px; font-size:14px; color: var(--gold); cursor:pointer; }
  .view-datetime { margin-top:12px; padding:11px 13px; background: var(--surface2); border-radius:10px; font-size:14px; color: var(--ink); }
  .view-mini-timeline-wrap { margin:14px 0; border-radius:12px; overflow:hidden; background: var(--surface2); padding:10px 0; }
  .view-mini-timeline { position:relative; height:140px; margin:0 16px; }
  .mini-hour-line { position:absolute; right:0; left:42px; height:1px; background: rgba(255,255,255,.08); }
  .mini-hour-label { position:absolute; left:0; font-size:10px; color: var(--muted); }
  .mini-event-block { position:absolute; right:0; left:46px; border-radius:8px; padding:5px 9px; overflow:hidden; box-sizing:border-box; }
  .mini-event-title { font-size:12px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-event-loc, .mini-event-time { font-size:10px; color:rgba(255,255,255,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .view-notes-section { margin-top:6px; }
  .view-notes { white-space:pre-wrap; line-height:1.5; color: var(--ink); font-size:14px; max-height:105px; overflow:hidden; position:relative; }
  .view-notes.expanded { max-height:none; }
  .view-notes a { color: var(--gold); text-decoration:underline; word-break:break-all; }
  .view-notes-toggle { background:none; border:none; color: var(--gold); font-size:13px; font-weight:700; margin-top:8px; cursor:pointer; padding:0; }
  .form-error { color: var(--danger); font-size:12px; margin: 6px 0; text-align:center; font-weight:600; }
  .confirm-box { background: var(--surface); border-radius:16px; padding:20px; max-width:320px; margin:auto; text-align:center; }
  .confirm-box p { margin:0 0 16px; font-size:14px; }
  .confirm-actions { display:flex; gap:10px; }
  .confirm-actions button { flex:1; padding:11px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer; }
  .confirm-cancel { background: var(--surface2); color: var(--ink); }
  .confirm-delete { background: var(--danger); color:#fff; }
  .day-view-overlay { display:none; position:fixed; inset:0; height:100dvh; background: var(--bg); z-index:40; flex-direction:column; }
  .day-view-overlay.show, .day-view-overlay.closing { display:flex; }
  .day-view-overlay.show { animation: dayViewIn .22s ease; }
  .day-view-overlay.closing { animation: dayViewOut .18s ease forwards; }
  @keyframes dayViewIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes dayViewOut { from { opacity:1; transform:none; } to { opacity:0; transform: translateY(16px); } }
  .day-view-header { display:flex; align-items:center; justify-content:space-between; padding: calc(16px + env(safe-area-inset-top)) 16px 6px; }
  .day-view-header .icon-btn { background:none; border:none; cursor:pointer; padding:4px 10px; }
  .day-view-month-label { font-size:16px; font-weight:800; }
  .week-strip { display:flex; padding: 0 10px 12px; gap:4px; }
  .week-strip .wd-cell { flex:1; text-align:center; padding:8px 2px; border-radius:12px; cursor:pointer; }
  .week-strip .wd-cell .wd-letter { font-size:11px; color: var(--muted); margin-bottom:4px; }
  .week-strip .wd-cell .wd-num { font-size:15px; font-weight:700; width:30px; height:30px; line-height:30px; margin:0 auto; border-radius:50%; }
  .week-strip .wd-cell.selected .wd-num { background: var(--gold); color:#1b1406; }
  .week-strip .wd-cell.is-today:not(.selected) .wd-num { box-shadow: inset 0 0 0 1.5px var(--gold); }
  .day-view-content { flex:1; overflow-y:auto; overscroll-behavior: contain; padding: 0 0 calc(20px + env(safe-area-inset-bottom)); touch-action: pan-y; }
  .allday-chips-row { display:flex; flex-wrap:wrap; gap:6px; margin: 0 16px 8px; }
  .allday-chip { font-size:12px; font-weight:700; padding:5px 10px; border-radius:8px; color:#fff; }
  .timeline-wrap { position:relative; height: 1440px; margin: 0 16px; transition: opacity .12s ease; }
  .anim-next { animation: slideInLeft .22s ease; }
  .anim-prev { animation: slideInRight .22s ease; }
  @keyframes slideInLeft { from { transform: translateX(24px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes slideInRight { from { transform: translateX(-24px); opacity:0; } to { transform:none; opacity:1; } }
  .timeline-grid { position:absolute; inset:0; }
  .hour-line { position:absolute; left:0; right:56px; height:0; border-top:1px solid var(--surface2); }
  .hour-label { position:absolute; right:2px; font-size:11px; color: var(--muted); background: var(--bg); padding: 0 2px; z-index:1; }
  .half-line { position:absolute; left:0; right:56px; height:0; border-top:1px solid rgba(156,163,175,0.15); }
  .timeline-events { position:absolute; top:0; left:0; right:58px; bottom:0; }
  .timeline-event { position:absolute; border-radius:8px; padding:4px 8px; overflow:hidden; cursor:pointer; box-sizing:border-box; touch-action:none; transition: box-shadow .15s ease; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; -webkit-user-drag:none; }
  .timeline-event.dragging { opacity:.97; box-shadow:0 10px 26px rgba(0,0,0,.55); z-index:6; transition:none; filter:brightness(1.12) saturate(1.25); transform:scale(1.035); }
  .timeline-event.edit-mode { outline: 2px solid #fff; outline-offset:1px; z-index:6; filter:brightness(1.08) saturate(1.15); box-shadow:0 6px 18px rgba(0,0,0,.4); transition: filter .15s ease, box-shadow .15s ease; }
  .te-handle { position:absolute; left:50%; transform:translateX(50%); width:34px; height:18px; background:#fff; border-radius:9px; box-shadow:0 2px 6px rgba(0,0,0,.5); touch-action:none; z-index:7; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  .te-handle::after { content:""; position:absolute; left:50%; top:50%; width:16px; height:3px; background:#8a8f99; border-radius:2px; transform:translate(50%,-50%); }
  .te-handle-top { top:-9px; }
  .te-handle-bottom { bottom:-9px; }
  .drag-time-label { position:absolute; right:2px; font-size:12px; font-weight:800; color:#1b1406; background: var(--gold); padding:2px 6px; border-radius:6px; z-index:8; pointer-events:none; }
  .event-context-menu { position:absolute; background: var(--surface); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.5); z-index:9; overflow:hidden; display:flex; flex-direction:row; }
  .event-context-menu button { flex:1; white-space:nowrap; padding:12px 14px; background:none; border:none; color:var(--ink); font-size:14px; cursor:pointer; }
  .event-context-menu button[data-action="copy"] { border-left:1px solid var(--surface2); }
  .event-context-menu button[data-action="delete"] { color: var(--danger); }
  .timeline-event .te-title { font-size:12px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .timeline-event .te-time { font-size:10px; color:rgba(255,255,255,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now-line { position:absolute; left:0; right:56px; height:0; border-top:2px solid var(--danger); z-index:2; }
  .user-icon-btn { position:absolute; top: calc(16px + env(safe-area-inset-top)); left:16px; width:38px; height:38px; border-radius:50%; background: var(--surface2); border:none; display:flex; align-items:center; justify-content:center; z-index:5; padding:0; }
  .user-icon-btn svg { width:20px; height:20px; color: var(--muted); }
  .user-icon-btn.connected svg { color: var(--ink); }
  .user-status-dot { position:absolute; bottom:1px; left:1px; width:11px; height:11px; border-radius:50%; background: var(--muted); border:2px solid var(--bg); }
  .user-icon-btn.connected .user-status-dot { background: #34c759; }
  .now-line .now-dot { position:absolute; right:-5px; top:-5px; width:10px; height:10px; border-radius:50%; background: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <button class="user-icon-btn" id="googleBtn" title="חיבור ל-Google Calendar">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v1.2c0 .7.5 1.2 1.2 1.2h17.2c.7 0 1.2-.5 1.2-1.2v-1.2c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
    <span class="user-status-dot"></span>
  </button>
  <div class="cal-header">
    <button class="nav-btn" id="prevMonth" aria-label="חודש קודם"><span dir="ltr" style="unicode-bidi: isolate-override;">›</span></button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-btn" id="nextMonth" aria-label="חודש הבא"><span dir="ltr" style="unicode-bidi: isolate-override;">‹</span></button>
  </div>
  <div class="top-actions">
    <button class="today-btn" id="todayBtn">היום</button>
  </div>
  <div class="weekday-row" id="weekdayRow"></div>
  <div class="day-grid" id="dayGrid"></div>

  <div class="agenda-head">
    <h2 id="monthAgendaLabel"></h2>
  </div>
  <div id="monthAgendaList"></div>
  <p class="empty-note" id="monthEmptyNote" style="display:none;">אין אירועים ביום זה.</p>
</div>

<div class="day-view-overlay" id="dayViewOverlay">
  <div class="day-view-header">
    <button class="icon-btn" id="dayViewBack" style="color: var(--ink); font-size: 22px; display:flex; align-items:center; gap:4px;">
      <span dir="ltr" style="unicode-bidi: isolate-override;">‹</span>
      <span style="font-size:14px; font-weight:600;">חודש</span>
    </button>
    <div class="day-view-month-label" id="dayViewMonthLabel"></div>
    <button class="icon-btn" id="dayViewAdd" style="color: var(--gold); font-size: 24px; font-weight: 800;">+</button>
  </div>
  <div class="week-strip" id="weekStrip"></div>
  <div class="agenda-head">
    <h2 id="agendaLabel"></h2>
  </div>
  <div class="allday-chips-row" id="allDayRow" style="display:none;"></div>
  <div class="day-view-content" id="dayViewContent">
    <div class="timeline-wrap" id="timelineWrap">
      <div class="timeline-grid" id="timelineGrid"></div>
      <div class="timeline-events" id="timelineEvents"></div>
      <div class="now-line" id="nowLine" style="display:none;"><span class="now-dot"></span></div>
      <div class="drag-time-label" id="dragTimeLabel" style="display:none;"></div>
    </div>
  </div>
</div>

<button class="fab" id="addBtn">+ אירוע חדש</button>
<button class="fab fab-secondary" id="scanImageBtn" title="הוספה מתמונה">📷</button>
<input type="file" id="scanImageInput" accept="image/*" style="display:none;">

<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-drag-handle"></div>
    <div class="modal-head">
      <h2 id="formTitleHead">אירוע חדש</h2>

<script>
// ===== Google Calendar sync config =====
const GOOGLE_CLIENT_ID = "239143987006-42gvbinfhcgdcr6bpfp50n9orjbrclnb.apps.googleusercontent.com";
const GOOGLE_SCOPES = "https://www.googleapis.com/auth/calendar.events openid email profile";
const GOOGLE_API_BASE = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
const REFRESH_TOKEN_KEY = "google_refresh_token_v1";
const REDIRECT_URI = window.location.origin + window.location.pathname;

let googleAccessToken = null;
let googleConnected = false;
let syncInFlight = false;

const STORAGE_KEY = "calendar_events_v1";
let events = [];

// ===== Local multi-profile system (no server — everything stays on this
// device/browser; lets a few people share one phone/tablet, each with their
// own separate events and their own Google Calendar connection) =====
const PROFILES_KEY = "app_profiles_v1";
const ACTIVE_PROFILE_KEY = "app_active_profile_v1";
function getProfiles() {
  try { return JSON.parse(localStorage.getItem(PROFILES_KEY) || "{}"); } catch(e) { return {}; }
}
function saveProfiles(p) { localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); }
function upsertProfile(email, fields) {
  const profiles = getProfiles();
  profiles[email] = { ...(profiles[email] || {}), ...fields, email };
  saveProfiles(profiles);
  return profiles[email];
}
function getActiveProfileEmail() { return localStorage.getItem(ACTIVE_PROFILE_KEY) || null; }
function getActiveProfile() {
  const email = getActiveProfileEmail();
  return email ? getProfiles()[email] : null;
}
function setActiveProfileEmail(email) { localStorage.setItem(ACTIVE_PROFILE_KEY, email); }
function clearActiveProfile() { localStorage.removeItem(ACTIVE_PROFILE_KEY); }
function nsKey(base) {
  const email = getActiveProfileEmail();
  return email ? base + ":" + email : base;
}
function loadEventsForActiveProfile() {
  try { events = JSON.parse(localStorage.getItem(nsKey(STORAGE_KEY)) || "[]"); } catch(e) { events = []; }
}
// One-time migration: this app worked as a single-profile app before profiles
// existed, so whoever creates the first profile on this device inherits
// whatever events/Google connection were already saved here.
function migrateLegacyDataOnce(email) {
  if (localStorage.getItem("legacy_migrated_v1")) return;
  const legacyEvents = localStorage.getItem(STORAGE_KEY);
  const legacyRefresh = localStorage.getItem(REFRESH_TOKEN_KEY);
  if (legacyEvents) localStorage.setItem(STORAGE_KEY + ":" + email, legacyEvents);
  if (legacyRefresh) localStorage.setItem(REFRESH_TOKEN_KEY + ":" + email, legacyRefresh);
  localStorage.setItem("legacy_migrated_v1", "1");
}

const HEBREW_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const WEEKDAY_LETTERS = ["א","ב","ג","ד","ה","ו","ש"];
const COLORS = [
  { key:"gold", value:"#d1a24a" },
  { key:"steel", value:"#6fa0c9" },
  { key:"green", value:"#6fb08a" },
  { key:"danger", value:"#d9694f" },
  { key:"purple", value:"#a48add" }
];

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth() + 1;
let selectedDate = toISO(now);
let editingId = null;
let viewingId = null;
let deleteTargetId = null;
let selectedColor = "gold";

function toISO(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
let overlayLockCount = 0;
let savedScrollY = 0;
function lockBodyScroll() {
  overlayLockCount++;
  if (overlayLockCount === 1) {
    savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    document.body.style.position = "fixed";
    document.body.style.top = "-" + savedScrollY + "px";
    document.body.style.left = "0";
    document.body.style.right = "0";
    document.body.style.width = "100%";
  }
}
function unlockBodyScroll() {
  overlayLockCount = Math.max(0, overlayLockCount - 1);
  if (overlayLockCount === 0) {
    document.body.style.position = "";
    document.body.style.top = "";
    document.body.style.left = "";
    document.body.style.right = "";
    document.body.style.width = "";
    window.scrollTo(0, savedScrollY);
  }
}
function showOverlay(id) {
  const el = document.getElementById(id);
  el.classList.remove("closing");
  el.classList.add("show");
  lockBodyScroll();
  fitToVisualViewport(el);
}
// iOS standalone (home-screen) apps sometimes compute position:fixed;inset:0
// against a stale/incorrect viewport height, leaving a gap at the bottom that
// exposes whatever sits behind. Force the real, current visual viewport
// height in JS as a more reliable fallback than CSS units alone.
function fitToVisualViewport(el) {
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  el.style.height = h + "px";
  const content = el.querySelector(".day-view-content");
  if (content) {
    const contentTop = content.getBoundingClientRect().top - el.getBoundingClientRect().top;
    content.style.height = Math.max(h - contentTop, 100) + "px";
  }
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    document.querySelectorAll(".day-view-overlay.show").forEach(fitToVisualViewport);
  });
}
window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    document.querySelectorAll(".day-view-overlay.show").forEach(fitToVisualViewport);
  }, 250);
});
function hideOverlay(id, duration) {
  const el = document.getElementById(id);
  el.classList.add("closing");
  setTimeout(() => { el.classList.remove("show", "closing"); }, duration || 190);
  unlockBodyScroll();
}

// Swipe-down-to-dismiss on bottom-sheet modals: drag the handle bar down;
// past a threshold (or a fast flick) it closes, otherwise it springs back.
function attachSheetDragToDismiss(overlayId) {
  const overlay = document.getElementById(overlayId);
  const modal = overlay.querySelector(".modal");
  const triggers = [modal.querySelector(".modal-drag-handle"), modal.querySelector(".modal-head")].filter(Boolean);
  if (!modal || !triggers.length) return;
  const DISMISS_PX = 120;
  let startY = 0, dragging = false, lastY = 0, lastT = 0, velocity = 0, activeTrigger = null;

  triggers.forEach(trigger => {
    trigger.addEventListener("pointerdown", (ev) => {
      if (ev.target.closest("button")) return; // let the × button work normally
      dragging = true;
      activeTrigger = trigger;
      startY = lastY = ev.clientY;
      lastT = performance.now();
      velocity = 0;
      modal.style.transition = "none";
      try { trigger.setPointerCapture(ev.pointerId); } catch(e) {}
    });
    trigger.addEventListener("pointermove", (ev) => {
      if (!dragging || activeTrigger !== trigger) return;
      ev.preventDefault();
      const dy = Math.max(0, ev.clientY - startY);
      const now = performance.now();
      const dt = now - lastT;
      if (dt > 0) velocity = (ev.clientY - lastY) / dt;
      lastY = ev.clientY; lastT = now;
      modal.style.transform = `translateY(${dy}px)`;
    });
    const finish = (ev) => {
      if (!dragging || activeTrigger !== trigger) return;
      dragging = false;
      activeTrigger = null;
      const dy = Math.max(0, (ev.clientY || lastY) - startY);
      modal.style.transition = "transform .2s ease";
      if (dy > DISMISS_PX || velocity > 1.2) {
        modal.style.transform = "translateY(100%)";
        overlay.style.transition = "opacity .2s ease";
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.classList.remove("show");
          overlay.style.opacity = ""; overlay.style.transition = "";
          modal.style.transform = ""; modal.style.transition = "";
          unlockBodyScroll();
        }, 200);
      } else {
        modal.style.transform = "translateY(0)";
        setTimeout(() => { modal.style.transition = ""; modal.style.transform = ""; }, 200);
      }
    };
    trigger.addEventListener("pointerup", finish);
    trigger.addEventListener("pointercancel", finish);
  });
}
["formOverlay", "viewOverlay"].forEach(attachSheetDragToDismiss);

function pad2(n) { return String(n).padStart(2,"0"); }
function addDaysISO(dateStr, n) {
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function persist() { localStorage.setItem(nsKey(STORAGE_KEY), JSON.stringify(events)); }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function colorValue(key) { const c = COLORS.find(c => c.key === key); return c ? c.value : COLORS[0].value; }

document.getElementById("weekdayRow").innerHTML = WEEKDAY_LETTERS.map(l => `<div>${l}</div>`).join("");
document.getElementById("colorRow").innerHTML = COLORS.map(c =>
  `<div class="color-swatch" data-color="${c.key}" style="background:${c.value};"></div>`
).join("");

function renderCalendar() {
  document.getElementById("monthLabel").textContent = HEBREW_MONTHS[viewMonth-1] + " " + viewYear;

  const firstOfMonth = new Date(viewYear, viewMonth-1, 1);
  const startWeekday = firstOfMonth.getDay();
  const count = daysInMonth(viewYear, viewMonth);
  const totalCells = Math.ceil((startWeekday + count) / 7) * 7;
  const gridStart = new Date(viewYear, viewMonth-1, 1 - startWeekday);

  const todayISO = toISO(new Date());
  let html = "";
  for (let i = 0; i < totalCells; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const iso = toISO(cellDate);
    const inMonth = cellDate.getMonth() === viewMonth - 1;
    const dayEvents = events.filter(e => eventOccursOn(e, iso)).sort(sortEvents);
    const dots = dayEvents.slice(0,4).map(e => `<span class="day-dot" style="background:${colorValue(e.color)};"></span>`).join("");
    const more = dayEvents.length > 4 ? `<div class="day-more">+${dayEvents.length-4}</div>` : "";
    html += `<div class="day-cell ${inMonth?"":"out-month"} ${iso===selectedDate?"selected":""} ${iso===todayISO?"is-today":""}" data-date="${iso}">
      <div class="day-num">${cellDate.getDate()}</div>
      <div class="day-dots">${dots}</div>
      ${more}
    </div>`;
  }
  const grid = document.getElementById("dayGrid");
  grid.innerHTML = html;
  grid.querySelectorAll(".day-cell").forEach(cell => {
    cell.addEventListener("click", () => {
      const iso = cell.dataset.date;
      const [y,m] = iso.split("-").map(Number);
      if (m !== viewMonth || y !== viewYear) { viewYear = y; viewMonth = m; }
      openDayView(iso);
    });
  });
  renderMonthAgenda();
}

function sortEvents(a, b) {
  if (a.allDay && !b.allDay) return -1;
  if (!a.allDay && b.allDay) return 1;
  return (a.startTime||"").localeCompare(b.startTime||"");
}
function eventEndDate(e) { return e.endDate || e.date; }
function eventOccursOn(e, iso) { return iso >= e.date && iso <= eventEndDate(e); }
function getDaySegment(e, iso) {
  const endDate = eventEndDate(e);
  const isFirst = iso === e.date;
  const isLast = iso === endDate;
  const startMin = isFirst ? timeToMinutes(e.startTime) : 0;
  let endMin = isLast ? (e.endTime ? timeToMinutes(e.endTime) : startMin + 30) : 1440;
  if (endMin <= startMin) endMin = startMin + 30;
  return { start: startMin, end: endMin, isFirst, isLast };
}
function segmentLabel(e, iso) {
  const seg = getDaySegment(e, iso);
  if (seg.isFirst && seg.isLast) return (e.startTime||"") + (e.endTime ? " - " + e.endTime : "");
  if (seg.isFirst) return (e.startTime||"") + " ←";
  if (seg.isLast) return "← " + (e.endTime||"");
  return "אירוע מתמשך";
}

function formatAgendaLabel(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  return d + " ב" + HEBREW_MONTHS[m-1] + " " + y;
}

function renderMonthAgenda() {
  document.getElementById("monthAgendaLabel").textContent = formatAgendaLabel(selectedDate);
  const list = events.filter(e => eventOccursOn(e, selectedDate)).sort(sortEvents);
  document.getElementById("monthEmptyNote").style.display = list.length === 0 ? "block" : "none";
  const wrap = document.getElementById("monthAgendaList");
  wrap.innerHTML = list.map(e => `
    <div class="event-item" data-id="${e.id}">
      <div class="event-color-bar" style="background:${colorValue(e.color)};"></div>
      <div class="event-time">${e.allDay ? "כל היום" : segmentLabel(e, selectedDate)}</div>
      <div style="flex:1;">
        <div class="event-title">${escapeHtml(e.title)}</div>
        ${e.location ? `<div class="event-location" data-loc="${escapeHtml(e.location)}">📍 ${escapeHtml(e.location)}</div>` : ""}
      </div>
    </div>
  `).join("");
  wrap.querySelectorAll(".event-item").forEach(item => {
    item.addEventListener("click", () => openView(item.dataset.id));
  });
}

let lastSelectedDate = null;
const HOUR_H = 60;

function renderAgenda() {
  document.getElementById("agendaLabel").textContent = formatAgendaLabel(selectedDate);
  const list = events.filter(e => eventOccursOn(e, selectedDate)).sort(sortEvents);
  const allDayEvents = list.filter(e => e.allDay);
  const timedEvents = list.filter(e => !e.allDay);

  const allDayRow = document.getElementById("allDayRow");
  if (allDayEvents.length) {
    allDayRow.style.display = "flex";
    allDayRow.innerHTML = allDayEvents.map(e =>
      `<div class="allday-chip" data-id="${e.id}" style="background:${colorValue(e.color)};">${escapeHtml(e.title)}</div>`
    ).join("");
    allDayRow.querySelectorAll(".allday-chip").forEach(chip => {
      chip.addEventListener("click", () => openEdit(chip.dataset.id));
    });
  } else {
    allDayRow.style.display = "none";
    allDayRow.innerHTML = "";
  }

  renderTimelineGrid();
  renderTimelineEvents(timedEvents);
  renderNowLine();

  if (document.getElementById("dayViewOverlay").classList.contains("show")) {
    document.getElementById("dayViewMonthLabel").textContent = formatAgendaLabel(selectedDate);
    renderWeekStrip();
    animateDayChange();
    // Only auto-scroll to "now"/7am when actually switching to a different
    // day — not on every re-render (e.g. after dragging/resizing an event),
    // which was yanking the view back up mid-interaction.
    if (selectedDate !== lastSelectedDate) scrollTimelineToRelevantTime();
  }
  lastSelectedDate = selectedDate;
}

function animateDayChange() {
  const wrap = document.getElementById("timelineWrap");
  if (!lastSelectedDate || lastSelectedDate === selectedDate) return;
  const cls = selectedDate > lastSelectedDate ? "anim-next" : "anim-prev";
  wrap.classList.remove("anim-next", "anim-prev");
  void wrap.offsetWidth; // force reflow so the animation restarts
  wrap.classList.add(cls);
}

function timeToMinutes(t) {
  if (!t) return 0;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + (m || 0);
}
function minutesToTime(mins) {
  mins = Math.max(0, Math.min(1439, Math.round(mins)));
  return pad2(Math.floor(mins / 60)) + ":" + pad2(mins % 60);
}

function renderTimelineGrid() {
  const grid = document.getElementById("timelineGrid");
  let html = "";
  for (let h = 0; h < 24; h++) {
    html += `<div class="hour-line" style="top:${h*HOUR_H}px;"></div>`;
    html += `<span class="hour-label" style="top:${Math.max(h*HOUR_H - 8, 2)}px;">${h}:00</span>`;
    html += `<div class="half-line" style="top:${h*HOUR_H + HOUR_H/2}px;"></div>`;
  }
  grid.innerHTML = html;
}

let editModeEventId = null;

function renderTimelineEvents(timedEvents) {
  const wrap = document.getElementById("timelineEvents");
  const withTimes = timedEvents.map(e => {
    const seg = getDaySegment(e, selectedDate);
    return { e, start: seg.start, end: seg.end };
  }).sort((a,b) => a.start - b.start || a.end - b.end);

  // simple column assignment for overlapping events
  const columnsEnd = [];
  withTimes.forEach(item => {
    let col = columnsEnd.findIndex(endTime => endTime <= item.start);
    if (col === -1) { col = columnsEnd.length; columnsEnd.push(item.end); }
    else { columnsEnd[col] = item.end; }
    item.col = col;
  });
  // determine max overlapping columns per event's own overlapping cluster
  withTimes.forEach(item => {
    const overlapping = withTimes.filter(o => o.start < item.end && o.end > item.start);
    item.totalCols = Math.max(...overlapping.map(o => o.col)) + 1;
  });

  wrap.innerHTML = withTimes.map(item => {
    const { e, start, end, col, totalCols } = item;
    const top = (start / 60) * HOUR_H;
    const height = Math.max(((end - start) / 60) * HOUR_H, 22);
    const widthPct = 100 / totalCols;
    const leftPct = col * widthPct;
    const editable = e.id === editModeEventId;
    return `<div class="timeline-event${editable ? " edit-mode" : ""}" data-id="${e.id}" style="top:${top}px; height:${height}px; right:calc(${leftPct}% + 2px); width:calc(${widthPct}% - 4px); background:${colorValue(e.color)};">
      <div class="te-title">${escapeHtml(e.title)}</div>
      <div class="te-time">${segmentLabel(e, selectedDate)}</div>
      ${e.location && height > 40 ? `<div class="te-time te-location" data-loc="${escapeHtml(e.location)}">📍 ${escapeHtml(e.location)}</div>` : ""}
      ${editable ? `<div class="te-handle te-handle-top" data-handle="start"></div><div class="te-handle te-handle-bottom" data-handle="end"></div>` : ""}
    </div>`;
  }).join("");
  wrap.querySelectorAll(".timeline-event").forEach(el => {
    el.addEventListener("click", (ev) => {
      if (el.dataset.justDragged === "1") { el.dataset.justDragged = ""; return; }
      if (ev.target.closest(".te-handle")) return;
      openView(el.dataset.id);
    });
    attachEventDrag(el);
    el.querySelectorAll(".te-handle").forEach(handle => attachHandleDrag(el, handle));
  });
}

// Long-press an event to enter "edit mode" (outline + two resize handles).
// While in edit mode, dragging the body moves the event (preserving
// duration); dragging a handle resizes its start or end. Snaps to 15-minute
// increments. Edit mode stays on after you lift your finger — it only
// clears when you tap elsewhere on the screen. Single-day events only.
const DRAG_LONG_PRESS_MS = 350;
const DRAG_SNAP_MIN = 15;

function showDragTimeLabel(topPx, text) {
  const label = document.getElementById("dragTimeLabel");
  label.style.top = (topPx - 10) + "px";
  label.textContent = text;
  label.style.display = "block";
}
function hideDragTimeLabel() {
  document.getElementById("dragTimeLabel").style.display = "none";
}

function enterEditMode(id) {
  if (editModeEventId === id) return;

  renderAgenda();
}
function exitEditMode() {

  editModeEventId = null;
  renderAgenda();
}
document.addEventListener("pointerdown", (ev) => {
  if (editModeEventId === null) return;
  if (ev.target.closest(`.timeline-event[data-id="${editModeEventId}"]`)) return;
  if (ev.target.closest("#eventContextMenu")) return;
  if (ev.target.closest("#weekStrip")) return;
  exitEditMode();
}, { capture: true });

function attachEventDrag(el) {
  let pressTimer = null;
  let dragging = false;
  let moved = false;
  let startY = 0;
  let startMin = 0;
  let durationMin = 0;

  const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };

  const beginDrag = (ev, ev_) => {
    dragging = true;
    el.classList.add("dragging");
    try { el.setPointerCapture(ev.pointerId); } catch(e) {}
    startMin = timeToMinutes(ev_.startTime || "00:00");
    durationMin = Math.max(timeToMinutes(ev_.endTime || ev_.startTime || "00:00") - startMin, DRAG_SNAP_MIN);
    if (navigator.vibrate) navigator.vibrate(8);
  };

  el.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".te-handle")) return;
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    const ev_ = events.find(x => x.id === el.dataset.id);
    if (!ev_ || ev_.allDay || ev_.date !== eventEndDate(ev_)) return; // skip all-day / multi-day
    ev.preventDefault();
    moved = false;
    startY = ev.clientY;
    cancelPress();
    if (el.dataset.id === editModeEventId) {
      // already in edit mode — move immediately, no long-press needed
      beginDrag(ev, ev_);
    } else {
      pressTimer = setTimeout(() => {
        editModeEventId = el.dataset.id;
        el.classList.add("edit-mode");
        beginDrag(ev, ev_);
      }, DRAG_LONG_PRESS_MS);
    }
  });

  let rafPending = false;
  el.addEventListener("pointermove", (ev) => {
    if (!dragging) {
      if (pressTimer && Math.abs(ev.clientY - startY) > 8) cancelPress();
      return;
    }
    ev.preventDefault();
    moved = true;
    const deltaY = ev.clientY - startY;
    let newStart = startMin + Math.round(deltaY / DRAG_SNAP_MIN) * DRAG_SNAP_MIN;
    newStart = Math.max(0, Math.min(newStart, 1440 - durationMin));
    el._pendingStart = newStart;
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      if (el._pendingStart == null) return;
      const topPx = (el._pendingStart / 60) * HOUR_H;
      el.style.top = topPx + "px";
      const timeEl = el.querySelector(".te-time");
      if (timeEl) timeEl.textContent = minutesToTime(el._pendingStart) + " - " + minutesToTime(el._pendingStart + durationMin);
      showDragTimeLabel(topPx, minutesToTime(el._pendingStart));
    });
  });

  const finishDrag = () => {
    cancelPress();
    if (!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    hideDragTimeLabel();
    const id = el.dataset.id;
    if (moved && el._pendingStart != null) {
      const ev_ = events.find(x => x.id === id);
      if (ev_) {
        ev_.startTime = minutesToTime(el._pendingStart);
        ev_.endTime = minutesToTime(el._pendingStart + durationMin);
        persist();
        pushUpdateToGoogle(ev_);
      }
      el.dataset.justDragged = "1";
    }
    el._pendingStart = null;
    renderAgenda(); // refresh so edit-mode handles reflect current state either way
    if (!moved) {
      const freshEl = document.querySelector(`.timeline-event[data-id="${id}"]`);
      if (freshEl) showEventContextMenu(freshEl, id);
    }
  };
  el.addEventListener("pointerup", finishDrag);
  el.addEventListener("pointercancel", finishDrag);
}

function duplicateEvent(id) {
  const e = events.find(x => x.id === id);
  if (!e) return;
  const copy = { ...e, id: uid(), googleEventId: null, createdAt: Date.now() };
  events.push(copy);
  persist();
  renderAgenda();
  pushCreateToGoogle(copy);
  showToast("האירוע שוכפל");
}

function showEventContextMenu(el, id) {

  const rect = el.getBoundingClientRect();

  menu.style.top = (rect.top - wrapRect.top + rect.height + 6) + "px";

  });
}

// Resize handles (top = adjust start, bottom = adjust end). Only present
// while the event is already in edit mode, so no long-press needed here.
function attachHandleDrag(el, handle) {
  const which = handle.dataset.handle; // "start" or "end"
  let dragging = false, startY = 0, fixedMin = 0, otherMin = 0, rafPending = false;

  handle.addEventListener("pointerdown", (ev) => {
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    ev.preventDefault();
    ev.stopPropagation();
    const ev_ = events.find(x => x.id === el.dataset.id);
    if (!ev_) return;
    dragging = true;
    startY = ev.clientY;
    try { handle.setPointerCapture(ev.pointerId); } catch(e) {}
    const s = timeToMinutes(ev_.startTime || "00:00");
    const e_ = timeToMinutes(ev_.endTime || ev_.startTime || "00:00");
    if (which === "start") { fixedMin = e_; otherMin = s; } else { fixedMin = s; otherMin = e_; }
    el.classList.add("dragging");
  });

  handle.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    ev.preventDefault();
    ev.stopPropagation();
    const deltaY = ev.clientY - startY;
    let newVal = otherMin + Math.round(deltaY / DRAG_SNAP_MIN) * DRAG_SNAP_MIN;
    if (which === "start") newVal = Math.max(0, Math.min(newVal, fixedMin - DRAG_SNAP_MIN));
    else newVal = Math.min(1440, Math.max(newVal, fixedMin + DRAG_SNAP_MIN));
    el._pendingHandleVal = newVal;
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      const v = el._pendingHandleVal;
      if (v == null) return;
      if (which === "start") {
        el.style.top = ((v / 60) * HOUR_H) + "px";
        el.style.height = Math.max(((fixedMin - v) / 60) * HOUR_H, 22) + "px";
      } else {
        el.style.height = Math.max(((v - fixedMin) / 60) * HOUR_H, 22) + "px";
      }
      const timeEl = el.querySelector(".te-time");
      if (timeEl) timeEl.textContent = which === "start"
        ? (minutesToTime(v) + " - " + minutesToTime(fixedMin))
        : (minutesToTime(fixedMin) + " - " + minutesToTime(v));
      showDragTimeLabel((v / 60) * HOUR_H, minutesToTime(v));
    });
  });

  const finishHandleDrag = () => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    hideDragTimeLabel();
    if (el._pendingHandleVal != null) {
      const ev_ = events.find(x => x.id === el.dataset.id);
      if (ev_) {
        if (which === "start") { ev_.startTime = minutesToTime(el._pendingHandleVal); ev_.endTime = minutesToTime(fixedMin); }
        else { ev_.startTime = minutesToTime(fixedMin); ev_.endTime = minutesToTime(el._pendingHandleVal); }
        persist();
        pushUpdateToGoogle(ev_);
      }
      el.dataset.justDragged = "1";
      renderAgenda();
    }
    el._pendingHandleVal = null;
  };
  handle.addEventListener("pointerup", finishHandleDrag);
  handle.addEventListener("pointercancel", finishHandleDrag);
}

function renderNowLine() {

function scrollTimelineToRelevantTime() {

  const targetMinutes = isToday ? (now.getHours() * 60) : 7 * 60;
  const targetPx = Math.max((targetMinutes / 60) * HOUR_H - 100, 0);
  content.scrollTo({ top: targetPx, behavior: lastSelectedDate ? "smooth" : "auto" });

function isoAddDays(iso, n) {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
}
function startOfWeekIso(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() - dt.getDay());
  return toISO(dt);
}

function renderWeekStrip() {
  const weekStartIso = startOfWeekIso(selectedDate);
  const todayIso = toISO(new Date());
  let html = "";
  for (let i = 0; i < 7; i++) {
    const iso = isoAddDays(weekStartIso, i);
    const [,, d] = iso.split("-");
    html += `<div class="wd-cell ${iso===selectedDate?"selected":""} ${iso===todayIso?"is-today":""}" data-date="${iso}">
      <div class="wd-letter">${WEEKDAY_LETTERS[i]}</div>
      <div class="wd-num">${parseInt(d,10)}</div>
    </div>`;
  }
  const strip = document.getElementById("weekStrip");
  strip.innerHTML = html;
  strip.querySelectorAll(".wd-cell").forEach(cell => {
    cell.addEventListener("click", () => {
      if (editModeEventId) {
        const ev_ = events.find(x => x.id === editModeEventId);
        if (ev_ && cell.dataset.date !== ev_.date) {
          const wasSingleDay = ev_.date === eventEndDate(ev_);
          ev_.date = cell.dataset.date;
          if (wasSingleDay) ev_.endDate = cell.dataset.date;
          persist();
          pushUpdateToGoogle(ev_);
          showToast("האירוע הועבר ל־" + formatAgendaLabel(cell.dataset.date));
        }
      }
      selectedDate = cell.dataset.date;
      const [y,m] = selectedDate.split("-").map(Number);
      viewYear = y; viewMonth = m;
      renderAgenda();
    });
  });
}

// swipe left/right on the day view to move between days
(function() {
  let touchStartX = null, touchStartY = null;
  const content = document.getElementById("dayViewContent");
  content.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  content.addEventListener("touchend", (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      // RTL layout: swipe right-to-left = next day, swipe left-to-right = previous day
      selectedDate = isoAddDays(selectedDate, dx > 0 ? 1 : -1);
      const [y,m] = selectedDate.split("-").map(Number);
      viewYear = y; viewMonth = m;
      renderAgenda();
    }
  }, { passive: true });
})();

function nearestRoundHourTimes() {
  const now = new Date();
  let startHour = now.getHours();
  if (now.getMinutes() > 0 || now.getSeconds() > 0) startHour += 1;
  if (startHour > 23) startHour = 23;
  let endHour = startHour + 1;
  if (endHour > 23) endHour = 23;
  return { start: pad2(startHour) + ":00", end: pad2(endHour) + ":00" };
}

function linkifyNotes(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

function renderMiniTimeline(e) {
  const wrap = document.getElementById("viewMiniTimelineWrap");
  const el = document.getElementById("viewMiniTimeline");
  if (e.allDay || eventEndDate(e) !== e.date || !e.startTime) { wrap.style.display = "none"; return; }
  const s = timeToMinutes(e.startTime);
  const en = Math.max(timeToMinutes(e.endTime || e.startTime), s + 15);
  let winStart = s - 60, winEnd = en + 60;
  const minSpan = 180;
  if (winEnd - winStart < minSpan) {
    const pad = (minSpan - (winEnd - winStart)) / 2;
    winStart -= pad; winEnd += pad;
  }
  winStart = Math.max(0, winStart);
  winEnd = Math.min(1440, winEnd);
  const containerH = 140;
  const pxPerMin = containerH / (winEnd - winStart);

  let html = "";
  const firstHour = Math.ceil(winStart / 60);
  const lastHour = Math.floor(winEnd / 60);
  for (let h = firstHour; h <= lastHour; h++) {
    const top = (h * 60 - winStart) * pxPerMin;
    html += `<div class="mini-hour-line" style="top:${top}px;"></div><span class="mini-hour-label" style="top:${top - 8}px;">${h}:00</span>`;
  }
  const evTop = (s - winStart) * pxPerMin;
  const evHeight = Math.max((en - s) * pxPerMin, 24);
  html += `<div class="mini-event-block" style="top:${evTop}px; height:${evHeight}px; background:${colorValue(e.color)};">
    <div class="mini-event-title">${escapeHtml(e.title || "")}</div>
    ${e.location ? `<div class="mini-event-loc">📍 ${escapeHtml(e.location)}</div>` : ""}
    <div class="mini-event-time">${minutesToTime(s)} - ${minutesToTime(en)}</div>
  </div>`;
  el.innerHTML = html;
  wrap.style.display = "block";
}

function resizeImageForOCR(file, maxDim, quality) {
  maxDim = maxDim || 2000;
  quality = quality || 0.9;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let width = img.naturalWidth, height = img.naturalHeight;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        if (!blob) { reject(new Error("כשל בעיבוד התמונה")); return; }
        resolve(blob);
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("כשל בטעינת התמונה")); };
    img.src = url;
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("כשל בהמרת התמונה"));
    reader.readAsDataURL(blob);
  });
}

// Title autocomplete from past events already in memory — no network, just
// suggests titles you've used before as you type a new event's name.
(function() {
  const input = document.getElementById("formTitle");
  const box = document.getElementById("titleSuggestions");
  function hideBox() { box.style.display = "none"; box.innerHTML = ""; }
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { hideBox(); return; }
    const seenTitles = new Set();
    const matches = events.slice()
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
      .filter(e => e.title && e.title.toLowerCase().includes(q) && e.title.toLowerCase() !== q)
      .filter(e => { if (seenTitles.has(e.title)) return false; seenTitles.add(e.title); return true; })
      .slice(0, 6);
    if (!matches.length) { hideBox(); return; }
    box.innerHTML = matches.map(e => {
      const timeText = e.allDay ? "יום שלם" : `${e.startTime || "?"} - ${e.endTime || "?"}`;
      const locText = e.location ? ` · 📍 ${escapeHtml(e.location)}` : "";
      return `<div class="loc-suggestion-item title-suggestion-item" data-id="${e.id}">
        <div class="tsi-title">${escapeHtml(e.title)}</div>
        <div class="tsi-sub">🕐 ${escapeHtml(timeText)}${locText}</div>
      </div>`;
    }).join("");
    box.style.display = "block";
    box.querySelectorAll(".loc-suggestion-item").forEach(item => {
      item.addEventListener("mousedown", (ev) => {
        ev.preventDefault();
        const src = events.find(x => x.id === item.dataset.id);
        if (!src) return;
        input.value = src.title;
        document.getElementById("formLocation").value = src.location || "";
        document.getElementById("formAllDay").checked = !!src.allDay;
        document.getElementById("formStart").value = src.allDay ? "" : (src.startTime || "");
        document.getElementById("formEnd").value = src.allDay ? "" : (src.endTime || "");
        updateAllDayUI();
        hideBox();
      });
    });
  });
  input.addEventListener("blur", () => setTimeout(hideBox, 150));
})();

// Address autocomplete via OpenStreetMap's free Nominatim search (no API
// key/billing needed), plus a "current location" option (using the phone's
// GPS + reverse geocoding) — the closest we can get in a web app to the
// native iOS location picker, since we can't access Contacts/system Maps
// from a browser. Debounced, and cancels any in-flight request before
// starting a new one, to stay well within Nominatim's usage policy.
(function() {
  const input = document.getElementById("formLocation");
  const box = document.getElementById("locSuggestions");
  let debounceTimer = null;
  let controller = null;

  const CURRENT_LOC_HTML = `<div class="loc-suggestion-item loc-current" data-current="1">📍 מיקום נוכחי</div>`;

  function hideSuggestions() { box.style.display = "none"; box.innerHTML = ""; }

  function attachCurrentLocationHandler() {
    const el = box.querySelector(".loc-current");
    if (!el) return;
    el.addEventListener("mousedown", (ev) => {
      ev.preventDefault();
      if (!navigator.geolocation) { showToast("איתור מיקום לא נתמך בדפדפן הזה"); hideSuggestions(); return; }
      hideSuggestions();
      showToast("מאתר את המיקום שלך...");
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const { latitude, longitude } = pos.coords;
          const url = `https://nominatim.openstreetmap.org/reverse?format=json&accept-language=he&lat=${latitude}&lon=${longitude}`;
          const res = await fetch(url);
          const data = await res.json();
          input.value = data.display_name || (latitude.toFixed(5) + ", " + longitude.toFixed(5));
          showToast("המיקום מולא");
        } catch (e) { showToast("לא הצלחתי לתרגם את המיקום לכתובת"); }
      }, () => { showToast("אין גישה למיקום — בדוק הרשאות מיקום למכשיר/דפדפן"); }, { timeout: 8000 });
    });
  }

  function showCurrentLocationOnly() {
    box.innerHTML = CURRENT_LOC_HTML;
    box.style.display = "block";
    attachCurrentLocationHandler();
  }

  input.addEventListener("focus", () => {
    if (input.value.trim().length < 3) showCurrentLocationOnly();
  });

  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const q = input.value.trim();
    if (q.length < 3) { showCurrentLocationOnly(); return; }
    debounceTimer = setTimeout(async () => {
      if (controller) controller.abort();
      controller = new AbortController();
      try {
        const url = "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&accept-language=he&limit=8&q=" + encodeURIComponent(q);
        const res = await fetch(url, { signal: controller.signal });
        const results = await res.json();
        box.innerHTML = CURRENT_LOC_HTML + results.map(r => {
          const a = r.address || {};
          const road = a.road || a.pedestrian || a.footway || a.residential || a.street || a.path || a.living_street || "";
          const houseNum = a.house_number || "";
          const city = a.city || a.town || a.village || a.municipality || "";
          const clean = (road && houseNum) ? `${road} ${houseNum}${city ? ", " + city : ""}` : r.display_name;
          return `<div class="loc-suggestion-item" data-value="${escapeHtml(clean)}">📌 ${escapeHtml(clean)}</div>`;
        }).join("");
        box.style.display = "block";
        attachCurrentLocationHandler();
        box.querySelectorAll(".loc-suggestion-item:not(.loc-current)").forEach(item => {
          item.addEventListener("mousedown", (ev) => {
            ev.preventDefault(); // keep focus/avoid input blur eating the click
            input.value = item.dataset.value;
            hideSuggestions();
          });
        });
      } catch (e) { /* aborted or offline — silently skip, typing still works normally */ }
    }, 400);
  });

  input.addEventListener("blur", () => setTimeout(hideSuggestions, 150));
})();

function startGoogleConnect(purpose) {
  const authUrl = "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "code",

  });

}

async function fetchGoogleUserinfo(accessToken) {
  const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
    headers: { Authorization: "Bearer " + accessToken }
  });
  if (!res.ok) throw new Error("userinfo failed");
  return res.json();
}

async function exchangeCodeForTokens(code, purpose) {
  const res = await fetch("/api/google-auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, redirect_uri: REDIRECT_URI })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "auth failed");
  googleAccessToken = data.access_token;

  if (purpose === "login") {
    const info = await fetchGoogleUserinfo(googleAccessToken);
    upsertProfile(info.email, { name: info.name || info.email, email: info.email, picture: info.picture || "", provider: "google" });
    migrateLegacyDataOnce(info.email);
    setActiveProfileEmail(info.email);
    loadEventsForActiveProfile();
  }

  if (data.refresh_token) localStorage.setItem(nsKey(REFRESH_TOKEN_KEY), data.refresh_token);
  googleConnected = true;
}

async function refreshGoogleSession() {
  const rt = localStorage.getItem(nsKey(REFRESH_TOKEN_KEY));
  if (!rt) return false;
  try {
    const res = await fetch("/api/google-refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: rt })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "refresh failed");
    googleAccessToken = data.access_token;
    googleConnected = true;
    return true;
  } catch(err) {
    localStorage.removeItem(nsKey(REFRESH_TOKEN_KEY));
    googleConnected = false;
    googleAccessToken = null;
    return false;
  }
}

function disconnectGoogle() {
  const rt = localStorage.getItem(nsKey(REFRESH_TOKEN_KEY));
  if (rt) fetch(`https://oauth2.googleapis.com/revoke?token=${encodeURIComponent(rt)}`, { method: "POST" }).catch(() => {});
  localStorage.removeItem(nsKey(REFRESH_TOKEN_KEY));
  googleAccessToken = null;
  googleConnected = false;
  updateGoogleButton();
  showToast("נותקת מ-Google Calendar");
}

// ===== Boot sequence: handle an OAuth redirect back first (which may be
// completing either "log me in" or "just connect my calendar"), then decide
// whether to show the welcome/login gate or the calendar itself. =====
async function boot() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  if (code) {
    window.history.replaceState({}, document.title, window.location.pathname);
    try {
      await exchangeCodeForTokens(code, state);
      showToast(state === "login" ? "התחברת בהצלחה" : "מחובר ל-Google Calendar");
    } catch(err) {
      showToast("החיבור ל-Google נכשל: " + err.message);
    }
  } else if (getActiveProfileEmail()) {
    await refreshGoogleSession();
  }

  if (!getActiveProfileEmail()) {
    showWelcomeScreen();
    return;
  }
  loadEventsForActiveProfile();
  applyActiveProfileToUI();
  updateGoogleButton();
  renderCalendar();
  renderAgenda();
  if (googleConnected) syncFromGoogle();
}
boot();

async function googleApiFetch(url, options={}, retried=false) {
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers||{}), "Authorization": "Bearer " + googleAccessToken, "Content-Type": "application/json" }
  });
  if (res.status === 401 && !retried) {
    const ok = await refreshGoogleSession();
    if (ok) return googleApiFetch(url, options, true);
    googleConnected = false; googleAccessToken = null; updateGoogleButton();
    showToast("החיבור ל-Google פג — יש להתחבר מחדש");
    throw new Error("unauthorized");
  }
  if (!res.ok) {
    let detail = "";
    try {
      const errBody = await res.json();
      detail = (errBody && errBody.error && (errBody.error.message || errBody.error)) || "";
      if (typeof detail !== "string") detail = JSON.stringify(detail);
    } catch(e) {}
    throw new Error("Google API error " + res.status + (detail ? ": " + detail : ""));
  }
  return res.status === 204 ? null : res.json();
}

function eventToGooglePayload(e) {
  const base = { summary: e.title || "", description: e.notes || "", location: e.location || "" };
  const endDate = eventEndDate(e);
  if (e.allDay) {
    return { ...base, start: { date: e.date }, end: { date: addDaysISO(endDate, 1) } };
  }
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Jerusalem";
  return {
    ...base,
    start: { dateTime: `${e.date}T${e.startTime || "00:00"}:00`, timeZone },
    end: { dateTime: `${endDate}T${e.endTime || e.startTime || "00:00"}:00`, timeZone }
  };
}

function googleEventToLocal(gEv) {
  const isAllDay = !!(gEv.start && gEv.start.date);
  let date, endDate, startTime = "", endTime = "";
  if (isAllDay) {
    date = gEv.start.date;
    endDate = gEv.end && gEv.end.date ? isoAddDays(gEv.end.date, -1) : date;
    if (endDate < date) endDate = date;
  } else {
    const startDt = new Date(gEv.start.dateTime);
    date = toISO(startDt);
    startTime = pad2(startDt.getHours()) + ":" + pad2(startDt.getMinutes());
    endDate = date;
    if (gEv.end && gEv.end.dateTime) {
      const endDt = new Date(gEv.end.dateTime);
      endDate = toISO(endDt);
      endTime = pad2(endDt.getHours()) + ":" + pad2(endDt.getMinutes());
    }
  }
  return { googleEventId: gEv.id, title: gEv.summary || "(ללא כותרת)", date, endDate, allDay: isAllDay, startTime, endTime, notes: gEv.description || "", location: gEv.location || "", color: "steel" };
}

async function pushCreateToGoogle(e) {
  if (!googleConnected) return;
  try {
    const created = await googleApiFetch(GOOGLE_API_BASE, { method: "POST", body: JSON.stringify(eventToGooglePayload(e)) });
    e.googleEventId = created.id;
    persist();
  } catch(err) {
    console.error("Google create error:", err);
    showToast("שגיאה ביצירת האירוע ב-Google: " + (err.message || "לא ידוע"));
  }
}
async function pushUpdateToGoogle(e) {
  if (!googleConnected) return;
  if (!e.googleEventId) { pushCreateToGoogle(e); return; }
  try {
    await googleApiFetch(`${GOOGLE_API_BASE}/${e.googleEventId}`, { method: "PATCH", body: JSON.stringify(eventToGooglePayload(e)) });
  } catch(err) {
    console.error("Google update error:", err);
    showToast("שגיאה בעדכון האירוע ב-Google: " + (err.message || "לא ידוע"));
  }
}
async function pushDeleteToGoogle(e) {
  if (!googleConnected || !e.googleEventId) return;
  try {
    await googleApiFetch(`${GOOGLE_API_BASE}/${e.googleEventId}`, { method: "DELETE" });
  } catch(err) { /* likely already gone on Google's side */ }
}

async function syncFromGoogle() {
  if (!googleConnected || syncInFlight) return;
  syncInFlight = true;
  try {
    const rangeStart = new Date(viewYear, viewMonth-2, 1);
    const rangeEnd = new Date(viewYear, viewMonth+1, 0);
    const params = new URLSearchParams({
      timeMin: rangeStart.toISOString(), timeMax: rangeEnd.toISOString(),
      singleEvents: "true", orderBy: "startTime", maxResults: "250"
    });
    const data = await googleApiFetch(`${GOOGLE_API_BASE}?${params.toString()}`);
    const items = (data && data.items) || [];
    const fetchedIds = new Set(items.filter(gEv => gEv.status !== "cancelled").map(gEv => gEv.id));
    let changed = 0;
    items.forEach(gEv => {
      if (gEv.status === "cancelled") return;
      const local = googleEventToLocal(gEv);
      const idx = events.findIndex(e => e.googleEventId === gEv.id);
      if (idx >= 0) {
        events[idx] = { ...events[idx], ...local };
      } else {
        events.push({ ...local, id: uid(), createdAt: Date.now() });
      }
      changed++;
    });
    // Reconcile deletions: if a previously-synced event no longer appears in
    // Google's response for this range, it was deleted (here or on another
    // device) — drop the stale local copy. Unsynced local-only events
    // (no googleEventId yet) are always kept.
    const rangeStartISO = toISO(rangeStart), rangeEndISO = toISO(rangeEnd);
    const before = events.length;
    events = events.filter(e => {
      if (!e.googleEventId) return true;
      if (fetchedIds.has(e.googleEventId)) return true;
      const overlapsRange = e.date <= rangeEndISO && eventEndDate(e) >= rangeStartISO;
      return !overlapsRange;
    });
    if (events.length !== before) changed++;
    if (changed) { persist(); renderCalendar(); renderAgenda(); }
  } catch(err) { /* errors already surfaced via googleApiFetch */ }
  finally { syncInFlight = false; }
}

// Pull fresh events automatically: whenever the app regains focus (e.g. switching
// back from another app, or coming back to the browser tab), and periodically
// while it stays open — so changes made on another device show up without
// needing to manually navigate months.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") syncFromGoogle();
});
window.addEventListener("focus", () => syncFromGoogle());
setInterval(() => { if (document.visibilityState === "visible") syncFromGoogle(); }, 45000);


// ---- .ics export ----
// ---- Send by email ----
document.getElementById("formEmail").addEventListener("click", () => {
  const e = events.find(x => x.id === editingId);
  if (!e) return;
  const subject = encodeURIComponent(e.title || "אירוע ביומן");
  const lines = [];
  const endDate = eventEndDate(e);
  if (endDate !== e.date) {
    lines.push("תאריך: " + formatAgendaLabel(e.date) + " עד " + formatAgendaLabel(endDate));
  } else {
    lines.push("תאריך: " + formatAgendaLabel(e.date));
  }
  lines.push("שעה: " + (e.allDay ? "כל היום" : (e.startTime || "") + (e.endTime ? " - " + e.endTime : "")));
  if (e.location) lines.push("מיקום: " + e.location);
  if (e.notes) { lines.push(""); lines.push(e.notes); }
  const body = encodeURIComponent(lines.join("\n"));
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
});
</script>
