<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן">
<meta name="theme-color" content="#1B2028">
<title>יומן</title>
<style>
  :root {
    --bg: #12151c;
    --surface: #1b2028;
    --surface2: #242b36;
    --ink: #f2f2f0;
    --muted: #9aa1ad;
    --gold: #d1a24a;
    --steel: #6fa0c9;
    --green: #6fb08a;
    --danger: #d9694f;
    --purple: #a48add;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .app { max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .cal-header .nav-btn { background:none; border:none; color: var(--ink); font-size:20px; padding:6px 10px; cursor:pointer; }
  .cal-header .month-label { font-size:19px; font-weight:800; }
  .today-btn { display:block; margin: 0 auto 14px; background: var(--surface); border:1px solid var(--surface2); color: var(--gold); font-size:13px; font-weight:700; padding:7px 16px; border-radius:999px; cursor:pointer; }
  .top-actions { display:flex; gap:10px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .top-actions .today-btn { margin: 0; }
  .today-btn.connected { color: var(--green); border-color: var(--green); }
  .modal-secondary { width:100%; margin-top:10px; padding:12px; border:1px solid var(--surface2); border-radius:12px; background:none; color: var(--ink); font-size:14px; font-weight:700; cursor:pointer; }
  .toast { position:fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background: var(--surface2); color: var(--ink); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,.4); z-index:30; opacity:0; pointer-events:none; transition: opacity .25s ease; }
  .toast.show { opacity:1; }
  .weekday-row { display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:11px; color: var(--muted); font-weight:700; margin-bottom:6px; }
  .day-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
  .day-cell { aspect-ratio: 1 / 1; border-radius:10px; background: var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:6px; cursor:pointer; position:relative; }
  .day-cell.out-month { opacity:.35; }
  .day-cell.selected { background: var(--surface2); box-shadow: inset 0 0 0 2px var(--gold); }
  .day-num { font-size:13px; font-weight:600; }
  .day-cell.is-today .day-num { background: var(--gold); color:#1b1406; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .day-dots { display:flex; gap:2px; margin-top:4px; flex-wrap:wrap; justify-content:center; max-width:32px; }
  .day-dot { width:5px; height:5px; border-radius:50%; }
  .day-more { font-size:9px; color: var(--muted); margin-top:2px; }
  .agenda-head { display:flex; align-items:center; justify-content:space-between; margin: 22px 0 10px; }
  .agenda-head h2 { font-size:15px; margin:0; }
  .event-item { display:flex; align-items:center; gap:10px; background: var(--surface); border:1px solid var(--surface2); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .event-color-bar { width:4px; align-self:stretch; border-radius:4px; flex-shrink:0; }
  .event-time { font-size:12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width:52px; }
  .event-title { font-size:14px; font-weight:700; flex:1; }
  .empty-note { text-align:center; color: var(--muted); font-size:13px; margin: 30px 0; }
  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); background: var(--gold); color:#1b1406; border:none; border-radius:999px; padding:14px 28px; font-size:15px; font-weight:800; box-shadow:0 8px 20px rgba(0,0,0,.4); cursor:pointer; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; align-items:flex-end; justify-content:center; }
  .overlay.show { display:flex; }
  .modal { background: var(--surface); width:100%; max-width:720px; border-radius:18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-head h2 { margin:0; font-size:18px; }
  .icon-btn { background:none; border:none; cursor:pointer; }
  .modal label { display:block; font-size:12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input[type=text], .modal input[type=date], .modal input[type=time], .modal textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--surface2); background: var(--surface2); color: var(--ink); font-size:15px; font-family:inherit; }
  .modal textarea { min-height:80px; resize:vertical; line-height:1.5; }
  .time-row { display:flex; gap:10px; }
  .time-row > div { flex:1; }
  .allday-row { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; }
  .allday-row input { width:auto; }
  .color-row { display:flex; gap:10px; margin-top:6px; }
  .color-swatch { width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .color-swatch.selected { border-color: var(--ink); }
  .modal-submit { width:100%; margin-top:18px; padding:13px; border:none; border-radius:12px; background: var(--gold); color:#1b1406; font-size:15px; font-weight:800; cursor:pointer; }
  .modal-delete { width:100%; margin-top:10px; padding:12px; border:1px solid var(--danger); border-radius:12px; background:none; color: var(--danger); font-size:14px; font-weight:700; cursor:pointer; }
  .form-error { color: var(--danger); font-size:12px; margin: 6px 0; text-align:center; font-weight:600; }
  .confirm-box { background: var(--surface); border-radius:16px; padding:20px; max-width:320px; margin:auto; text-align:center; }
  .confirm-box p { margin:0 0 16px; font-size:14px; }
  .confirm-actions { display:flex; gap:10px; }
  .confirm-actions button { flex:1; padding:11px; border-radius:10px; border:none; font-size:14px; font-weight:700; cursor:pointer; }
  .confirm-cancel { background: var(--surface2); color: var(--ink); }
  .confirm-delete { background: var(--danger); color:#fff; }
</style>
</head>
<body>
<div class="app">
  <div class="cal-header">
    <button class="nav-btn" id="prevMonth" aria-label="חודש קודם"><span dir="ltr" style="unicode-bidi: isolate-override;">›</span></button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-btn" id="nextMonth" aria-label="חודש הבא"><span dir="ltr" style="unicode-bidi: isolate-override;">‹</span></button>
  </div>
  <div class="top-actions">
    <button class="today-btn" id="todayBtn">היום</button>
    <button class="today-btn" id="googleBtn">🔗 חיבור ל-Google Calendar</button>
  </div>
  <div class="weekday-row" id="weekdayRow"></div>
  <div class="day-grid" id="dayGrid"></div>

  <div class="agenda-head">
    <h2 id="agendaLabel"></h2>
  </div>
  <div id="agendaList"></div>
  <p class="empty-note" id="emptyNote" style="display:none;">אין אירועים ביום זה.</p>
</div>

<button class="fab" id="addBtn">+ אירוע חדש</button>

<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="formTitleHead">אירוע חדש</h2>
      <button class="icon-btn" id="closeForm" style="color:var(--muted); font-size:18px;">×</button>
    </div>
    <label>כותרת</label>
    <input type="text" id="formTitle" placeholder="שם האירוע">
    <label>תאריך</label>
    <input type="date" id="formDate">
    <div class="allday-row">
      <input type="checkbox" id="formAllDay">
      <label for="formAllDay" style="margin:0;">כל היום</label>
    </div>
    <div class="time-row" id="timeRow">
      <div><label>שעת התחלה</label><input type="time" id="formStart"></div>
      <div><label>שעת סיום</label><input type="time" id="formEnd"></div>
    </div>
    <label>צבע</label>
    <div class="color-row" id="colorRow"></div>
    <label>הערות</label>
    <textarea id="formNotes" placeholder="פרטים נוספים (לא חובה)"></textarea>
    <p class="form-error" id="formError" style="display:none;"></p>
    <button class="modal-submit" id="formSubmit">שמירה</button>
    <button class="modal-secondary" id="formEmail" style="display:none;">✉️ שליחת פרטי האירוע במייל</button>
    <button class="modal-delete" id="formDelete" style="display:none;">מחיקת אירוע</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="deleteOverlay">
  <div class="confirm-box">
    <p>למחוק את האירוע הזה?</p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="cancelDelete">ביטול</button>
      <button class="confirm-delete" id="confirmDelete">מחיקה</button>
    </div>
  </div>
</div>

<script>
// ===== Google Calendar sync config =====
const GOOGLE_CLIENT_ID = "239143987006-42gvbinfhcgdcr6bpfp50n9orjbrclnb.apps.googleusercontent.com";
const GOOGLE_SCOPES = "https://www.googleapis.com/auth/calendar.events";
const GOOGLE_API_BASE = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
const REFRESH_TOKEN_KEY = "google_refresh_token_v1";
const REDIRECT_URI = window.location.origin + window.location.pathname;

let googleAccessToken = null;
let googleConnected = false;

const STORAGE_KEY = "calendar_events_v1";
let events = [];
try { events = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { events = []; }

const HEBREW_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const WEEKDAY_LETTERS = ["א","ב","ג","ד","ה","ו","ש"];
const COLORS = [
  { key:"gold", value:"#d1a24a" },
  { key:"steel", value:"#6fa0c9" },
  { key:"green", value:"#6fb08a" },
  { key:"danger", value:"#d9694f" },
  { key:"purple", value:"#a48add" }
];

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth() + 1;
let selectedDate = toISO(now);
let editingId = null;
let deleteTargetId = null;
let selectedColor = "gold";

function toISO(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function pad2(n) { return String(n).padStart(2,"0"); }
function addDaysISO(dateStr, n) {
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function colorValue(key) { const c = COLORS.find(c => c.key === key); return c ? c.value : COLORS[0].value; }

document.getElementById("weekdayRow").innerHTML = WEEKDAY_LETTERS.map(l => `<div>${l}</div>`).join("");
document.getElementById("colorRow").innerHTML = COLORS.map(c =>
  `<div class="color-swatch" data-color="${c.key}" style="background:${c.value};"></div>`
).join("");

function renderCalendar() {
  document.getElementById("monthLabel").textContent = HEBREW_MONTHS[viewMonth-1] + " " + viewYear;

  const firstOfMonth = new Date(viewYear, viewMonth-1, 1);
  const startWeekday = firstOfMonth.getDay();
  const count = daysInMonth(viewYear, viewMonth);
  const totalCells = Math.ceil((startWeekday + count) / 7) * 7;
  const gridStart = new Date(viewYear, viewMonth-1, 1 - startWeekday);

  const todayISO = toISO(new Date());
  let html = "";
  for (let i = 0; i < totalCells; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const iso = toISO(cellDate);
    const inMonth = cellDate.getMonth() === viewMonth - 1;
    const dayEvents = events.filter(e => e.date === iso).sort(sortEvents);
    const dots = dayEvents.slice(0,4).map(e => `<span class="day-dot" style="background:${colorValue(e.color)};"></span>`).join("");
    const more = dayEvents.length > 4 ? `<div class="day-more">+${dayEvents.length-4}</div>` : "";
    html += `<div class="day-cell ${inMonth?"":"out-month"} ${iso===selectedDate?"selected":""} ${iso===todayISO?"is-today":""}" data-date="${iso}">
      <div class="day-num">${cellDate.getDate()}</div>
      <div class="day-dots">${dots}</div>
      ${more}
    </div>`;
  }
  const grid = document.getElementById("dayGrid");
  grid.innerHTML = html;
  grid.querySelectorAll(".day-cell").forEach(cell => {
    cell.addEventListener("click", () => {
      const iso = cell.dataset.date;
      const [y,m] = iso.split("-").map(Number);
      if (m !== viewMonth || y !== viewYear) { viewYear = y; viewMonth = m; }
      selectedDate = iso;
      renderCalendar();
      renderAgenda();
    });
  });
}

function sortEvents(a, b) {
  if (a.allDay && !b.allDay) return -1;
  if (!a.allDay && b.allDay) return 1;
  return (a.startTime||"").localeCompare(b.startTime||"");
}

function formatAgendaLabel(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  return d + " ב" + HEBREW_MONTHS[m-1] + " " + y;
}

function renderAgenda() {
  document.getElementById("agendaLabel").textContent = formatAgendaLabel(selectedDate);
  const list = events.filter(e => e.date === selectedDate).sort(sortEvents);
  document.getElementById("emptyNote").style.display = list.length === 0 ? "block" : "none";
  const wrap = document.getElementById("agendaList");
  wrap.innerHTML = list.map(e => `
    <div class="event-item" data-id="${e.id}">
      <div class="event-color-bar" style="background:${colorValue(e.color)};"></div>
      <div class="event-time">${e.allDay ? "כל היום" : (e.startTime || "") + (e.endTime ? " - " + e.endTime : "")}</div>
      <div class="event-title">${escapeHtml(e.title)}</div>
    </div>
  `).join("");
  wrap.querySelectorAll(".event-item").forEach(item => {
    item.addEventListener("click", () => openEdit(item.dataset.id));
  });
}

function updateAllDayUI() {
  const isAllDay = document.getElementById("formAllDay").checked;
  document.getElementById("timeRow").style.display = isAllDay ? "none" : "flex";
}
document.getElementById("formAllDay").addEventListener("change", updateAllDayUI);

function selectColor(key) {
  selectedColor = key;
  document.querySelectorAll(".color-swatch").forEach(sw => sw.classList.toggle("selected", sw.dataset.color === key));
}
document.getElementById("colorRow").querySelectorAll(".color-swatch").forEach(sw => {
  sw.addEventListener("click", () => selectColor(sw.dataset.color));
});

function openAdd() {
  editingId = null;
  document.getElementById("formTitleHead").textContent = "אירוע חדש";
  document.getElementById("formTitle").value = "";
  document.getElementById("formDate").value = selectedDate;
  document.getElementById("formAllDay").checked = false;
  document.getElementById("formStart").value = "";
  document.getElementById("formEnd").value = "";
  document.getElementById("formNotes").value = "";
  document.getElementById("formError").style.display = "none";
  document.getElementById("formDelete").style.display = "none";
  document.getElementById("formEmail").style.display = "none";
  selectColor("gold");
  updateAllDayUI();
  document.getElementById("formOverlay").classList.add("show");
}
function openEdit(id) {
  const e = events.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById("formTitleHead").textContent = "עריכת אירוע";
  document.getElementById("formTitle").value = e.title;
  document.getElementById("formDate").value = e.date;
  document.getElementById("formAllDay").checked = !!e.allDay;
  document.getElementById("formStart").value = e.startTime || "";
  document.getElementById("formEnd").value = e.endTime || "";
  document.getElementById("formNotes").value = e.notes || "";
  document.getElementById("formError").style.display = "none";
  document.getElementById("formDelete").style.display = "block";
  document.getElementById("formEmail").style.display = "block";
  selectColor(e.color || "gold");
  updateAllDayUI();
  document.getElementById("formOverlay").classList.add("show");
}

document.getElementById("addBtn").addEventListener("click", openAdd);
document.getElementById("closeForm").addEventListener("click", () => document.getElementById("formOverlay").classList.remove("show"));
document.getElementById("formOverlay").addEventListener("click", (e) => { if (e.target.id === "formOverlay") e.currentTarget.classList.remove("show"); });

document.getElementById("formSubmit").addEventListener("click", () => {
  const title = document.getElementById("formTitle").value.trim();
  const date = document.getElementById("formDate").value;
  const allDay = document.getElementById("formAllDay").checked;
  const startTime = document.getElementById("formStart").value;
  const endTime = document.getElementById("formEnd").value;
  const notes = document.getElementById("formNotes").value.trim();
  const errEl = document.getElementById("formError");

  if (!title) { errEl.textContent = "נא להזין כותרת"; errEl.style.display = "block"; return; }
  if (!date) { errEl.textContent = "נא לבחור תאריך"; errEl.style.display = "block"; return; }
  if (!allDay && startTime && endTime && endTime < startTime) { errEl.textContent = "שעת הסיום לפני שעת ההתחלה"; errEl.style.display = "block"; return; }

  if (editingId) {
    const e = events.find(x => x.id === editingId);
    e.title = title; e.date = date; e.allDay = allDay;
    e.startTime = allDay ? "" : startTime; e.endTime = allDay ? "" : endTime;
    e.notes = notes; e.color = selectedColor;
    persist();
    pushUpdateToGoogle(e);
  } else {
    const newEvent = { id: uid(), title, date, allDay, startTime: allDay?"":startTime, endTime: allDay?"":endTime, notes, color: selectedColor, createdAt: Date.now() };
    events.push(newEvent);
    persist();
    pushCreateToGoogle(newEvent);
  }
  selectedDate = date;
  const [y,m] = date.split("-").map(Number);
  viewYear = y; viewMonth = m;
  document.getElementById("formOverlay").classList.remove("show");
  renderCalendar();
  renderAgenda();
});

document.getElementById("formDelete").addEventListener("click", () => {
  deleteTargetId = editingId;
  document.getElementById("formOverlay").classList.remove("show");
  document.getElementById("deleteOverlay").classList.add("show");
});
document.getElementById("cancelDelete").addEventListener("click", () => {
  document.getElementById("deleteOverlay").classList.remove("show");
  deleteTargetId = null;
});
document.getElementById("confirmDelete").addEventListener("click", () => {
  const target = events.find(e => e.id === deleteTargetId);
  events = events.filter(e => e.id !== deleteTargetId);
  persist();
  deleteTargetId = null;
  document.getElementById("deleteOverlay").classList.remove("show");
  renderCalendar();
  renderAgenda();
  if (target) pushDeleteToGoogle(target);
});

document.getElementById("prevMonth").addEventListener("click", () => {
  viewMonth--; if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  renderCalendar();
  syncFromGoogle();
});
document.getElementById("nextMonth").addEventListener("click", () => {
  viewMonth++; if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  renderCalendar();
  syncFromGoogle();
});
document.getElementById("todayBtn").addEventListener("click", () => {
  const t = new Date();
  viewYear = t.getFullYear(); viewMonth = t.getMonth()+1; selectedDate = toISO(t);
  renderCalendar();
  renderAgenda();
  syncFromGoogle();
});

renderCalendar();
renderAgenda();

// ---- Toast ----
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ===== Google Calendar sync =====
function updateGoogleButton() {
  const btn = document.getElementById("googleBtn");
  btn.textContent = googleConnected ? "✓ מחובר ל-Google Calendar" : "🔗 חיבור ל-Google Calendar";
  btn.classList.toggle("connected", googleConnected);
}

function startGoogleConnect() {
  const authUrl = "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "code",
    scope: GOOGLE_SCOPES,
    access_type: "offline",
    prompt: "consent"
  });
  window.location.href = authUrl;
}

async function exchangeCodeForTokens(code) {
  const res = await fetch("/api/google-auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, redirect_uri: REDIRECT_URI })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "auth failed");
  if (data.refresh_token) localStorage.setItem(REFRESH_TOKEN_KEY, data.refresh_token);
  googleAccessToken = data.access_token;
  googleConnected = true;
}

async function refreshGoogleSession() {
  const rt = localStorage.getItem(REFRESH_TOKEN_KEY);
  if (!rt) return false;
  try {
    const res = await fetch("/api/google-refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: rt })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "refresh failed");
    googleAccessToken = data.access_token;
    googleConnected = true;
    return true;
  } catch(err) {
    localStorage.removeItem(REFRESH_TOKEN_KEY);
    googleConnected = false;
    googleAccessToken = null;
    return false;
  }
}

async function initGoogleAuth() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (code) {
    window.history.replaceState({}, document.title, window.location.pathname);
    try {
      await exchangeCodeForTokens(code);
      showToast("מחובר ל-Google Calendar");
      updateGoogleButton();
      syncFromGoogle();
    } catch(err) {
      showToast("החיבור ל-Google נכשל");
    }
    return;
  }
  const restored = await refreshGoogleSession();
  if (restored) {
    updateGoogleButton();
    syncFromGoogle();
  }
}
initGoogleAuth();

document.getElementById("googleBtn").addEventListener("click", () => {
  if (googleConnected) {
    const rt = localStorage.getItem(REFRESH_TOKEN_KEY);
    if (rt) fetch(`https://oauth2.googleapis.com/revoke?token=${encodeURIComponent(rt)}`, { method: "POST" }).catch(() => {});
    localStorage.removeItem(REFRESH_TOKEN_KEY);
    googleAccessToken = null;
    googleConnected = false;
    updateGoogleButton();
    showToast("נותקת מ-Google Calendar");
    return;
  }
  startGoogleConnect();
});

async function googleApiFetch(url, options={}, retried=false) {
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers||{}), "Authorization": "Bearer " + googleAccessToken, "Content-Type": "application/json" }
  });
  if (res.status === 401 && !retried) {
    const ok = await refreshGoogleSession();
    if (ok) return googleApiFetch(url, options, true);
    googleConnected = false; googleAccessToken = null; updateGoogleButton();
    showToast("החיבור ל-Google פג — יש להתחבר מחדש");
    throw new Error("unauthorized");
  }
  if (!res.ok) throw new Error("Google API error " + res.status);
  return res.status === 204 ? null : res.json();
}

function eventToGooglePayload(e) {
  const base = { summary: e.title || "", description: e.notes || "" };
  if (e.allDay) {
    return { ...base, start: { date: e.date }, end: { date: addDaysISO(e.date, 1) } };
  }
  return {
    ...base,
    start: { dateTime: `${e.date}T${e.startTime || "00:00"}:00` },
    end: { dateTime: `${e.date}T${e.endTime || e.startTime || "00:00"}:00` }
  };
}

function googleEventToLocal(gEv) {
  const isAllDay = !!(gEv.start && gEv.start.date);
  let date, startTime = "", endTime = "";
  if (isAllDay) {
    date = gEv.start.date;
  } else {
    const startDt = new Date(gEv.start.dateTime);
    date = toISO(startDt);
    startTime = pad2(startDt.getHours()) + ":" + pad2(startDt.getMinutes());
    if (gEv.end && gEv.end.dateTime) {
      const endDt = new Date(gEv.end.dateTime);
      endTime = pad2(endDt.getHours()) + ":" + pad2(endDt.getMinutes());
    }
  }
  return { googleEventId: gEv.id, title: gEv.summary || "(ללא כותרת)", date, allDay: isAllDay, startTime, endTime, notes: gEv.description || "", color: "steel" };
}

async function pushCreateToGoogle(e) {
  if (!googleConnected) return;
  try {
    const created = await googleApiFetch(GOOGLE_API_BASE, { method: "POST", body: JSON.stringify(eventToGooglePayload(e)) });
    e.googleEventId = created.id;
    persist();
  } catch(err) { showToast("שגיאה ביצירת האירוע ב-Google"); }
}
async function pushUpdateToGoogle(e) {
  if (!googleConnected) return;
  if (!e.googleEventId) { pushCreateToGoogle(e); return; }
  try {
    await googleApiFetch(`${GOOGLE_API_BASE}/${e.googleEventId}`, { method: "PATCH", body: JSON.stringify(eventToGooglePayload(e)) });
  } catch(err) { showToast("שגיאה בעדכון האירוע ב-Google"); }
}
async function pushDeleteToGoogle(e) {
  if (!googleConnected || !e.googleEventId) return;
  try {
    await googleApiFetch(`${GOOGLE_API_BASE}/${e.googleEventId}`, { method: "DELETE" });
  } catch(err) { /* likely already gone on Google's side */ }
}

async function syncFromGoogle() {
  if (!googleConnected) return;
  try {
    const rangeStart = new Date(viewYear, viewMonth-2, 1);
    const rangeEnd = new Date(viewYear, viewMonth+1, 0);
    const params = new URLSearchParams({
      timeMin: rangeStart.toISOString(), timeMax: rangeEnd.toISOString(),
      singleEvents: "true", orderBy: "startTime", maxResults: "250"
    });
    const data = await googleApiFetch(`${GOOGLE_API_BASE}?${params.toString()}`);
    const items = (data && data.items) || [];
    let changed = 0;
    items.forEach(gEv => {
      if (gEv.status === "cancelled") return;
      const local = googleEventToLocal(gEv);
      const idx = events.findIndex(e => e.googleEventId === gEv.id);
      if (idx >= 0) {
        events[idx] = { ...events[idx], ...local };
      } else {
        events.push({ ...local, id: uid(), createdAt: Date.now() });
      }
      changed++;
    });
    if (changed) { persist(); renderCalendar(); renderAgenda(); }
  } catch(err) { /* errors already surfaced via googleApiFetch */ }
}

// ---- .ics export ----
// ---- Send by email ----
document.getElementById("formEmail").addEventListener("click", () => {
  const e = events.find(x => x.id === editingId);
  if (!e) return;
  const subject = encodeURIComponent(e.title || "אירוע ביומן");
  const lines = [];
  lines.push("תאריך: " + formatAgendaLabel(e.date));
  lines.push("שעה: " + (e.allDay ? "כל היום" : (e.startTime || "") + (e.endTime ? " - " + e.endTime : "")));
  if (e.notes) { lines.push(""); lines.push(e.notes); }
  const body = encodeURIComponent(lines.join("\n"));
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
});
</script>
